<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a0040"/>
      <stop offset="55%" stop-color="#0a0020"/>
      <stop offset="100%" stop-color="#04000d"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 L0 0 0 48" fill="none" stroke="#ff00d4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.4" fill="#ff00d4" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="1024" height="768" fill="url(#bg)"/>
  <rect width="1024" height="768" fill="url(#grid)"/>
  <rect width="1024" height="768" fill="url(#dots)"/>
  <g opacity="0.15">
    <rect x="80" y="80" width="864" height="608" fill="none" stroke="#ff00d4" stroke-width="2"/>
    <rect x="100" y="100" width="824" height="568" fill="none" stroke="#c000ff" stroke-width="1"/>
  </g>
  <text x="512" y="370" font-family="monospace" font-size="130" font-weight="900"
        fill="#ff00d4" text-anchor="middle" opacity="0.18" letter-spacing="22">CLASSIC</text>
  <text x="512" y="432" font-family="monospace" font-size="20"
        fill="#00f0ff" text-anchor="middle" opacity="0.4" letter-spacing="10">// BG PLACEHOLDER</text>
</svg>
