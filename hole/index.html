<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hole (prototype)</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Three.js + cannon-es, vendored locally so the prototype runs offline. -->
    <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/",
        "cannon-es": "./vendor/cannon-es.js"
      }
    }
    </script>
</head>

<body>
    <a class="home" href="../" aria-label="Back to The Madderverse" title="Back to The Madderverse">&#x2302;</a>

    <canvas id="scene" aria-label="Hole game"></canvas>

    <div class="hud" aria-live="polite">
        <span class="hud-item">Size <b id="hudSize">0.9</b></span>
        <span class="hud-item">Eaten <b id="hudEaten">0</b></span>
    </div>

    <button id="resetBtn" class="reset-btn" type="button">Reset</button>

    <div id="devPanel" class="dev-panel" hidden aria-label="Dev controls">
        <div class="dev-row">
            <label for="devSpeed">STEER <span id="devSpeedOut">0.045</span></label>
            <input id="devSpeed" type="range" min="0.01" max="0.12" step="0.005" value="0.045">
        </div>
        <div class="dev-row">
            <label for="devGrow">GROWTH <span id="devGrowOut">0.045</span></label>
            <input id="devGrow" type="range" min="0.01" max="0.15" step="0.005" value="0.045">
        </div>
        <button id="devCopy" class="dev-btn" type="button">Copy values</button>
        <span id="devCopyMsg" class="dev-msg" aria-live="polite"></span>
    </div>

    <p class="hint" id="hint">Loading food&hellip;</p>

    <script type="module" src="main.js"></script>
</body>
</html>
