<body>

<a class="madder-home" href="../" aria-label="Back to The Madderverse" title="Back to The Madderverse">&#x2302;</a>

<div class="madder-controls">
    <span class="badge level-badge">Lv <strong id="level">1</strong></span>
    <span class="badge timer-badge">Time: <strong id="timer">0.0</strong>s</span>
    <span class="badge">Tries: <strong id="attempts">0</strong></span>
    <span class="badge best-badge">Best: <strong id="best">--</strong></span>
    <button id="ctrlBtn" class="btn btn-icon" type="button" title="Control mode (tilt / drag / both)">&#127918;</button>
    <button id="recenterBtn" class="btn btn-icon" type="button" title="Recenter tilt (hold phone how you like, then tap)">&#127919;</button>
    <button id="dbgBtn" class="btn btn-icon" type="button" title="Toggle physics debug overlay">DBG</button>
    <button id="mute" class="btn btn-icon" type="button" title="Mute (M)" aria-pressed="false">&#9834;</button>
    <button id="restart" class="btn" type="button" title="Restart level (R)">Restart</button>
</div>

<div class="wrap">
    <div class="stage">
        <canvas id="game" width="640" height="640" aria-label="Munki Madness game canvas"></canvas>

        <div id="startScreen" class="overlay">
            <div class="overlay-card">
                <h1>Munki&nbsp;Madness</h1>
                <p class="tag">Roll across the curved mesh and fall into the well.</p>
                <p class="how" id="howText">Tilt your device to roll &mdash; or drag anywhere on screen.</p>
                <button id="startBtn" class="btn btn-big" type="button">Start Rolling</button>
                <p class="ctrl-line">Control: <strong id="ctrlLabel">Tilt</strong> <span class="hint">(tap the &#127918; button to change)</span></p>
            </div>
        </div>

        <div id="endScreen" class="overlay" hidden>
            <div class="overlay-card">
                <h2 id="endTitle">In the Well!</h2>
                <div id="endStars" class="end-stars" data-stars="0">☆☆☆</div>
                <div class="end-stats">
                    <span>Time <strong id="endTime">0.0</strong>s</span>
                    <span>Tries <strong id="endTries">0</strong></span>
                </div>
                <div id="endBest" class="end-best" hidden>NEW BEST TIME!</div>
                <button id="nextBtn" class="btn btn-big" type="button">Next Level</button>
                <button id="replayBtn" class="btn" type="button">Replay</button>
            </div>
        </div>

        <div id="fallFlash" class="fall-flash" aria-hidden="true"></div>
    </div>
</div>

<script src="game.js?v=20260519e"></script>

<footer class="site-footer-slim" aria-label="Site info">

    <span class="sep" aria-hidden="true">&middot;</span>
    <a href="../about.html">About</a>
</footer>
<script>document.querySelectorAll('[data-year]').forEach(function(el){el.textContent=new Date().getFullYear();});</script>

<!-- DEV-ONLY: level editor gate (Phase 3 of the v2.0 rebuild). Loads
     editor.js only via ?editor=1 or the Konami code; zero footprint
     otherwise. editor.js does not exist until Phase 3 lands. -->
<script>
(function(){
  function loadEditor(){
    if(window.__mmEditorLoaded) return;
    window.__mmEditorLoaded=true;
    var s=document.createElement('script');
    s.src='editor.js?v=20260519e'; s.async=true;
    document.body.appendChild(s);
  }
  if(/[?&]editor=1(?:&|$)/.test(location.search)){ loadEditor(); return; }
  var seq=[38,38,40,40,37,39,37,39,66,65], i=0;
  window.addEventListener('keydown',function(e){
    i=(e.keyCode===seq[i])?i+1:(e.keyCode===seq[0]?1:0);
    if(i===seq.length){ i=0; loadEditor(); }
  });
})();
</script>

</body>
