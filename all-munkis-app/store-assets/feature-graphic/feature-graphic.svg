<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" role="img" aria-label="All Munkis feature graphic">
    <!-- ============================================================
         Google Play FEATURE GRAPHIC — 1024×500   *** PLACEHOLDER ***

         Shown as the banner at the top of the Play listing. MUST be
         exactly 1024×500 px, PNG or JPG, no alpha, < 1MB when raster.
         No critical content in the outer ~24px (Play overlays a play
         button + crops slightly on some surfaces). Keep the wordmark
         and at least one full Munki centred.

         Six rainbow Munkis lined up + the ALL MUNKIS wordmark, on the
         dark stage. Presentable for a quick review pass; swap before
         public production. Visible PLACEHOLDER strip bottom-right.

         Export: rasterize at 2048×1000 (2×) then downscale to
         1024×500 for crisp edges. Spec: ../README.md
         ============================================================ -->
    <defs>
        <radialGradient id="fg-bg" cx="50%" cy="30%" r="90%">
            <stop offset="0%"  stop-color="#1a1530"/>
            <stop offset="55%" stop-color="#0c0c1a"/>
            <stop offset="100%" stop-color="#070710"/>
        </radialGradient>
        <radialGradient id="fg-shine" cx="42%" cy="36%" r="70%">
            <stop offset="0"   stop-color="#fff" stop-opacity="0.3"/>
            <stop offset="0.5" stop-color="#fff" stop-opacity="0.06"/>
            <stop offset="1"   stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <rect width="1024" height="500" fill="url(#fg-bg)"/>

    <!-- Rainbow arc spanning the banner -->
    <g transform="translate(512 470)" fill="none" stroke-linecap="round" opacity="0.9">
        <path d="M-470 0 A 470 470 0 0 1 470 0" stroke="#dc2626" stroke-width="22"/>
        <path d="M-420 0 A 420 420 0 0 1 420 0" stroke="#ff9800" stroke-width="22"/>
        <path d="M-370 0 A 370 370 0 0 1 370 0" stroke="#fbbf24" stroke-width="22"/>
        <path d="M-320 0 A 320 320 0 0 1 320 0" stroke="#43a047" stroke-width="22"/>
        <path d="M-270 0 A 270 270 0 0 1 270 0" stroke="#1e88e5" stroke-width="22"/>
        <path d="M-220 0 A 220 220 0 0 1 220 0" stroke="#9c27b0" stroke-width="22"/>
    </g>

    <!-- Six little Munkis in a row, one per rainbow colour -->
    <g transform="translate(512 300)">
        <!-- helper: each Munki is body+head+phones at x offset -->
        <g id="m" />
        <!-- Render six tinted copies -->
        <g transform="translate(-340 0)">
            <ellipse cx="0" cy="40" rx="46" ry="48" fill="#dc2626" stroke="#7f1d1d" stroke-width="5"/>
            <circle cx="0" cy="-30" r="42" fill="#dc2626" stroke="#7f1d1d" stroke-width="5"/>
            <circle cx="0" cy="-30" r="42" fill="url(#fg-shine)"/>
            <circle cx="-13" cy="-36" r="6" fill="#1a0c0c"/><circle cx="13" cy="-36" r="6" fill="#1a0c0c"/>
            <path d="M-15 -14 Q0 -2 15 -14" fill="none" stroke="#1a0c0c" stroke-width="5" stroke-linecap="round"/>
            <path d="M-42 -30 A 42 42 0 0 1 42 -30" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
            <ellipse cx="-42" cy="-30" rx="12" ry="16" fill="#161616"/><ellipse cx="42" cy="-30" rx="12" ry="16" fill="#161616"/>
        </g>
        <g transform="translate(-204 0)">
            <ellipse cx="0" cy="40" rx="46" ry="48" fill="#ff9800" stroke="#bf360c" stroke-width="5"/>
            <circle cx="0" cy="-30" r="42" fill="#ff9800" stroke="#bf360c" stroke-width="5"/>
            <circle cx="0" cy="-30" r="42" fill="url(#fg-shine)"/>
            <circle cx="-13" cy="-36" r="6" fill="#3a1c00"/><circle cx="13" cy="-36" r="6" fill="#3a1c00"/>
            <path d="M-15 -14 Q0 -2 15 -14" fill="none" stroke="#3a1c00" stroke-width="5" stroke-linecap="round"/>
            <path d="M-42 -30 A 42 42 0 0 1 42 -30" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
            <ellipse cx="-42" cy="-30" rx="12" ry="16" fill="#161616"/><ellipse cx="42" cy="-30" rx="12" ry="16" fill="#161616"/>
        </g>
        <g transform="translate(-68 0)">
            <ellipse cx="0" cy="40" rx="46" ry="48" fill="#fbbf24" stroke="#92400e" stroke-width="5"/>
            <circle cx="0" cy="-30" r="42" fill="#fbbf24" stroke="#92400e" stroke-width="5"/>
            <circle cx="0" cy="-30" r="42" fill="url(#fg-shine)"/>
            <circle cx="-13" cy="-36" r="6" fill="#3a2c00"/><circle cx="13" cy="-36" r="6" fill="#3a2c00"/>
            <path d="M-15 -14 Q0 -2 15 -14" fill="none" stroke="#3a2c00" stroke-width="5" stroke-linecap="round"/>
            <path d="M-42 -30 A 42 42 0 0 1 42 -30" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
            <ellipse cx="-42" cy="-30" rx="12" ry="16" fill="#161616"/><ellipse cx="42" cy="-30" rx="12" ry="16" fill="#161616"/>
        </g>
        <g transform="translate(68 0)">
            <ellipse cx="0" cy="40" rx="46" ry="48" fill="#43a047" stroke="#1b5e20" stroke-width="5"/>
            <circle cx="0" cy="-30" r="42" fill="#43a047" stroke="#1b5e20" stroke-width="5"/>
            <circle cx="0" cy="-30" r="42" fill="url(#fg-shine)"/>
            <circle cx="-13" cy="-36" r="6" fill="#0c1a0c"/><circle cx="13" cy="-36" r="6" fill="#0c1a0c"/>
            <path d="M-15 -14 Q0 -2 15 -14" fill="none" stroke="#0c1a0c" stroke-width="5" stroke-linecap="round"/>
            <path d="M-42 -30 A 42 42 0 0 1 42 -30" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
            <ellipse cx="-42" cy="-30" rx="12" ry="16" fill="#161616"/><ellipse cx="42" cy="-30" rx="12" ry="16" fill="#161616"/>
        </g>
        <g transform="translate(204 0)">
            <ellipse cx="0" cy="40" rx="46" ry="48" fill="#1e88e5" stroke="#0d47a1" stroke-width="5"/>
            <circle cx="0" cy="-30" r="42" fill="#1e88e5" stroke="#0d47a1" stroke-width="5"/>
            <circle cx="0" cy="-30" r="42" fill="url(#fg-shine)"/>
            <circle cx="-13" cy="-36" r="6" fill="#0c1426"/><circle cx="13" cy="-36" r="6" fill="#0c1426"/>
            <path d="M-15 -14 Q0 -2 15 -14" fill="none" stroke="#0c1426" stroke-width="5" stroke-linecap="round"/>
            <path d="M-42 -30 A 42 42 0 0 1 42 -30" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
            <ellipse cx="-42" cy="-30" rx="12" ry="16" fill="#161616"/><ellipse cx="42" cy="-30" rx="12" ry="16" fill="#161616"/>
        </g>
        <g transform="translate(340 0)">
            <ellipse cx="0" cy="40" rx="46" ry="48" fill="#9c27b0" stroke="#4a148c" stroke-width="5"/>
            <circle cx="0" cy="-30" r="42" fill="#9c27b0" stroke="#4a148c" stroke-width="5"/>
            <circle cx="0" cy="-30" r="42" fill="url(#fg-shine)"/>
            <circle cx="-13" cy="-36" r="6" fill="#1a0c26"/><circle cx="13" cy="-36" r="6" fill="#1a0c26"/>
            <path d="M-15 -14 Q0 -2 15 -14" fill="none" stroke="#1a0c26" stroke-width="5" stroke-linecap="round"/>
            <path d="M-42 -30 A 42 42 0 0 1 42 -30" fill="none" stroke="#111" stroke-width="10" stroke-linecap="round"/>
            <ellipse cx="-42" cy="-30" rx="12" ry="16" fill="#161616"/><ellipse cx="42" cy="-30" rx="12" ry="16" fill="#161616"/>
        </g>
    </g>

    <!-- Wordmark -->
    <text x="512" y="92" text-anchor="middle"
          font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif"
          font-size="76" font-weight="800" letter-spacing="6" fill="#f4f4ff">ALL <tspan fill="#ff5cab">MUNKIS</tspan></text>
    <text x="512" y="130" text-anchor="middle"
          font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif"
          font-size="24" letter-spacing="3" fill="#9fb8b6">Six colors make a rainbow. Two are always left out.</text>

    <!-- Placeholder marker -->
    <text x="1008" y="490" text-anchor="end"
          font-family="monospace" font-size="18" letter-spacing="3"
          fill="#4a4a5e">PLACEHOLDER — SWAP BEFORE PRODUCTION</text>
</svg>
