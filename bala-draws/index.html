<body>

<a class="madder-home" href="../" aria-label="Back to Madderverse" title="Back to Madderverse">&#x2302;</a>

<main class="stage" id="stage">
    <div class="paper" id="paper">
        <div class="fx-layer" id="fx-layer">
            <canvas id="canvas" aria-label="Drawing canvas"></canvas>
        </div>
    </div>
</main>

<div class="toolbar">
    <div class="palette" id="palette" role="toolbar" aria-label="Color palette"></div>

    <div class="row">
        <div class="sizes" id="brush-sizes" role="toolbar" aria-label="Brush size">
            <button class="size-btn" data-size="3" aria-label="Thin pencil"><span class="dot dot-s"></span></button>
            <button class="size-btn active" data-size="10" aria-label="Medium pencil"><span class="dot dot-m"></span></button>
            <button class="size-btn" data-size="24" aria-label="Thick pencil"><span class="dot dot-l"></span></button>
        </div>
        <button class="tool-btn" id="eraser" aria-label="Eraser"><span class="ico">🧽</span><span class="lbl">Erase</span></button>
        <button class="tool-btn" id="clear" aria-label="Clear drawing"><span class="ico">🗑️</span><span class="lbl">Clear</span></button>
    </div>

    <div class="row beat-row">
        <button class="tool-btn primary" id="play" aria-label="Play beat"><span class="ico" id="play-ico">▶</span><span class="lbl" id="play-lbl">Play</span></button>
        <button class="tool-btn cycle" id="cycle" aria-label="Next beat"><span class="ico">🔁</span><span class="lbl" id="beat-name">Boom Bap</span></button>
    </div>

    <div class="row effects" id="effects" role="toolbar" aria-label="Effects"></div>
</div>

<footer class="site-footer-slim" aria-label="Site info">
    <span>&copy; <span data-year></span> <a href="https://madsundar.com/" target="_blank" rel="noopener">Mad Sundar LLC</a></span>
    <span class="sep" aria-hidden="true">·</span>
    <a href="../">Madderverse</a>
    <span class="sep" aria-hidden="true">·</span>
    <a href="../about.html">About</a>
</footer>

<script src="game.js"></script>
<script>document.querySelectorAll('[data-year]').forEach(function(el){el.textContent=new Date().getFullYear();});</script>
</body>
</html>
