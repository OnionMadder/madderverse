<body>

<header class="top">
    <a href="../" class="back">&larr; Madderverse</a>
    <h1>Go Eat Worms</h1>
    <span class="header-spacer" aria-hidden="true"></span>
</header>

<!-- Stage now reads as a horizontal "fishing-into-a-lake" view: sky on
     top, horizon band, lake water on the bottom. After splash the stage
     gets the .underwater class, which fades out the sky/horizon so the
     scene becomes a fully submerged side-view (where step-N art for the
     underwater chase will eventually live). -->
<div class="stage" id="stage" aria-label="Fishing area">
    <div class="sky"     aria-hidden="true"></div>
    <div class="horizon" aria-hidden="true"></div>

    <div class="collection" id="collection">
        Caught <strong id="caughtCount">0</strong>
    </div>

    <!-- Fishing line: from a virtual rod anchor (bottom of stage,
         off-screen below the player's hands) up to the bait. -->
    <svg class="line-layer" id="lineLayer" aria-hidden="true">
        <line id="fishLine" class="fish-line" x1="0" y1="0" x2="0" y2="0"/>
    </svg>

    <!-- Stretchy slingshot rubber band — legacy, kept hidden via CSS so
         the line itself doubles as the elastic. -->
    <svg class="band-layer" id="bandLayer" aria-hidden="true">
        <path id="bandShadow" class="rubber-band-shadow" d=""/>
        <path id="bandPath"   class="rubber-band"        d=""/>
    </svg>

    <!-- Worm bait: sprite-sheet-driven. game.js swaps background-position
         to advance frames as the state machine changes (idle / pull
         tension / flight panic / splash). Source sheet:
         sprites/worm-catch.png (1080x1335 per frame, 6 cols x 3 rows). -->
    <div class="bait" id="bait" aria-label="Worm bait"></div>

    <footer>
        &copy; <span id="year"></span>
        <a href="https://madsundar.com/" target="_blank" rel="noopener">Mad Sundar</a>
    </footer>
</div>

<script src="game.js"></script>

</body>
