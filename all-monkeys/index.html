<body>

    <header>
        <div class="header-inner">
            <div class="title-block">
                <div class="status">System Status: Operational</div>
                <h1>Bala's <span class="neon-pink">Adventures</span></h1>
                <p class="subtitle">Module: All Munkis // Sub-Routine: Nugget_Mod.exe</p>
            </div>
            <div class="header-buttons">
                <button id="remixBtn" class="btn btn-remix" type="button">REMIX</button>
                <button id="clearBtn" class="btn btn-clear" type="button">CLEAR</button>
                <button id="muteBtn" class="icon-btn" type="button" aria-label="mute"><span id="muteIcon">🔊</span></button>
            </div>
        </div>
    </header>

    <main>
        <div class="stage-wrap">
            <div id="stage" class="stage" aria-label="8 sprunki slots"></div>
        </div>
    </main>

    <div class="tray-wrap">
        <div class="tray-hint">Drag a mod onto a slot · tap a slot to clear it</div>
        <div id="tray" class="tray" aria-label="16 mods"></div>
    </div>

    <script src="game.js"></script>
