<body class="scanlines">

<main id="friend-picker-app">
<h1>Friend Picker</h1>

  <div id="ui-layer">
    <span id="timer-wrap">TIME: <span id="timer">0:30</span></span>
    <span id="score-wrap">BOOGERS: <span id="score">0</span> / <span id="score-goal">30</span></span>
    <button id="end-btn">END GAME</button>
    <button id="reset-btn">RESET</button>
    <button id="mute-btn" aria-label="Toggle sound">SOUND: ON</button>
  </div>

  <div id="game-container">
    <button id="start-btn">START PICKING</button>

    <aside id="friends-collected" aria-label="Special booger friends collected">
      <div class="friends-collected-title">FRIENDS</div>
      <div id="friends-collected-list"></div>
    </aside>

    <div id="reticle" class="game-element" aria-hidden="true">
      <span class="reticle-ring"></span>
      <span class="reticle-cross"></span>
    </div>
    <div id="hand" class="game-element" aria-hidden="true" hidden></div>

    <div id="reveal-overlay" hidden>
      <div class="reveal-card">
        <h2 id="reveal-title">ROUND COMPLETE</h2>
        <p id="reveal-stats"></p>
        <div id="reveal-friends-grid"></div>
        <div class="reveal-actions">
          <button id="play-again">PLAY AGAIN</button>
          <button id="reveal-back">END GAME</button>
        </div>
      </div>
    </div>
  </div>

</main>

<script src="game.js"></script>


</body>
</html>
