<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Go Eat Worms</title>
    <link rel="canonical" href="https://madderverse.org/eat-worms/" />
    <meta property="og:url" content="https://madderverse.org/eat-worms/" />
    <meta name="twitter:url" content="https://madderverse.org/eat-worms/" />
    <meta name="title" content="Go Eat Worms - A No-Fail Fishing Toy from The Madderverse" />
    <meta name="description" content="Flick the worm, splash into the water, catch fish (and weirder stuff). Free, ad-free, kid-friendly." />
    <meta name="keywords" content="kids fishing game, flick to cast, no-fail fishing, ad-free games, The Madderverse, Onion Madder, Mad Sundar LLC, indie kids games" />
    <meta name="author" content="Onion Madder" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Go Eat Worms - A No-Fail Fishing Toy from The Madderverse" />
    <meta property="og:description" content="Flick the worm, splash into the water, catch fish (and weirder stuff)." />
    <meta property="og:image" content="https://madderverse.org/assets/img/logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Go Eat Worms - A No-Fail Fishing Toy from The Madderverse" />
    <meta name="twitter:description" content="Flick the worm, splash into the water, catch fish (and weirder stuff)." />
    <meta name="twitter:image" content="https://madderverse.org/assets/img/twitter-card.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://madderverse.org/assets/favi/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://madderverse.org/assets/favi/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://madderverse.org/assets/favi/favicon-16x16.png" />
    <link rel="manifest" href="https://madderverse.org/assets/favi/site.webmanifest" />
    <link rel="shortcut icon" href="https://madderverse.org/assets/favi/favicon.ico" />
    <meta name="theme-color" content="#00ffcc" />
    <meta name="apple-mobile-web-app-title" content="Go Eat Worms" />
    <meta name="application-name" content="Go Eat Worms" />
    <script data-goatcounter="https://madderverse.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

<style>
:root {
    --accent-cyan: #00ffcc;
    --accent-pink: #ff00ff;
    --water-top:    #2dd4bf;
    --water-mid:    #1d4ed8;
    --water-deep:   #0c1f3a;
    --shore:        #1a1a2e;
    --shore-glow:   rgba(0, 255, 204, 0.18);
    --worm-pink:    #ec4899;
    --worm-deep:    #831843;
    --line:         rgba(255, 255, 255, 0.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: #fff;
    background: var(--shore);
}

body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}

/* ---------- header ---------- */
header.top {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
    padding: 0.35rem 0.7rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    min-height: 44px;
    z-index: 10;
}

header.top h1 {
    font-size: clamp(1rem, 4vw, 1.4rem);
    margin: 0;
    font-weight: 900;
    background: linear-gradient(to bottom, #fff 60%, var(--accent-cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(2px 2px 0 var(--accent-pink));
    letter-spacing: 1px;
    white-space: nowrap;
    text-align: center;
    flex: 1;
}

.back {
    color: var(--accent-cyan);
    text-decoration: none;
    font-family: monospace;
    font-size: 0.85rem;
    padding: 0.4rem 0.65rem;
    border: 1px solid var(--accent-cyan);
    border-radius: 8px;
    white-space: nowrap;
    min-height: 40px;
    min-width: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
    background: transparent;
    cursor: pointer;
    line-height: 1;
}
.back:active {
    background: var(--accent-cyan);
    color: #000;
    box-shadow: 0 0 12px var(--accent-cyan);
}

.header-spacer { min-width: 40px; }

/* ---------- stage ---------- */
/* Stage takes the rest of the viewport. Water area on top, shore at bottom.
   touch-action: none disables browser scroll/pinch so flick gestures land
   cleanly on the bait instead of scrolling the page. */
.stage {
    flex: 1;
    position: relative;
    width: 100%;
    overflow: hidden;
    touch-action: none;
    background:
        linear-gradient(
            to bottom,
            var(--water-top) 0%,
            var(--water-mid) 55%,
            var(--water-deep) 100%
        );
}

/* Subtle moving caustics-ish shimmer overlay on the water — pure CSS,
   doesn't affect layout. */
.stage::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
        repeating-linear-gradient(
            45deg,
            rgba(255, 255, 255, 0.03) 0 6px,
            transparent 6px 18px
        );
    pointer-events: none;
}

/* Water-surface line near the top of the shore. Also acts as the splash
   horizon for the flick mechanic (step 2). */
.waterline {
    position: absolute;
    bottom: var(--shore-h, 22%);
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(to bottom, rgba(255, 255, 255, 0.6), transparent);
    box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.35);
    pointer-events: none;
}

/* ---------- shore (bottom band where the worm lives at rest) ---------- */
.shore {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: var(--shore-h, 22%);
    background:
        radial-gradient(ellipse at 50% 0%, var(--shore-glow), transparent 70%),
        linear-gradient(to bottom, #14223a 0%, var(--shore) 100%);
    border-top: 1px solid rgba(0, 255, 204, 0.25);
    z-index: 2;
}

/* ---------- bait / worm ---------- */
/* Worm sits on the shore at bottom-center. In step 2 it becomes draggable
   and gets a fishing-line tether. For now it's a static placeholder so
   the layout reads correctly. */
.bait {
    position: absolute;
    bottom: calc(var(--shore-h, 22%) * 0.5 - 22px);
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 44px;
    z-index: 3;
    pointer-events: auto;
    touch-action: none;
}

.bait svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.55));
}

/* Faint guide ring under the worm so the kid sees the touch target. */
.bait::before {
    content: '';
    position: absolute;
    inset: -16px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 255, 204, 0.18), transparent 70%);
    pointer-events: none;
}

/* ---------- aim arc preview (step 2) ---------- */
/* Full-stage SVG layer that shows a dotted parabolic preview of where the
   bait will land. Hidden when not aiming; updated on every pointermove. */
.arc-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    display: none;
}
.arc-layer.active { display: block; width: 100%; height: 100%; }
.arc-path {
    fill: none;
    stroke: rgba(255, 255, 255, 0.85);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-dasharray: 4 9;
    filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.45));
}
.arc-target {
    fill: rgba(255, 255, 255, 0.8);
    stroke: rgba(255, 255, 255, 0.95);
    stroke-width: 1.5;
    filter: drop-shadow(0 0 6px rgba(0, 255, 204, 0.6));
}
/* Red-tinted preview when the user is aiming somewhere we can't cast
   (below the waterline). Tells them visually that release will cancel. */
.arc-layer.invalid .arc-path   { stroke: rgba(255, 99, 99, 0.7); }
.arc-layer.invalid .arc-target { fill: rgba(255, 99, 99, 0.7); stroke: rgba(255, 99, 99, 0.9); filter: none; }

/* ---------- fishing line (step 2) ---------- */
/* Single SVG line tracking the bait. Start point is fixed at the rod
   anchor (top-center of the stage); end point follows the bait. */
.line-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    width: 100%;
    height: 100%;
}
.fish-line {
    stroke: rgba(255, 255, 255, 0.45);
    stroke-width: 1.5;
    stroke-linecap: round;
}

/* ---------- splash ring (step 2) ---------- */
.splash {
    position: absolute;
    width: 0;
    height: 0;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.85);
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: splash-expand 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
    z-index: 4;
}
@keyframes splash-expand {
    0%   { width: 0;     height: 0;     opacity: 1;   border-width: 3px; }
    70%  { width: 90px;  height: 50px;  opacity: 0.5; border-width: 2px; }
    100% { width: 130px; height: 70px;  opacity: 0;   border-width: 1px; }
}

/* While aiming we shift the bait z-index above the dimmer + lock the
   pointer to it. While in flight we make sure the bait can't be grabbed. */
body.aiming .bait { z-index: 6; }
body.flying .bait { pointer-events: none; }

/* When the bait is in flight, JS sets top/left in pixel coords; clear
   the rest-state bottom anchor so absolute positioning takes over. */
.bait.in-flight {
    bottom: auto;
    left: 0;
    top: 0;
    transform: translate(-50%, -50%);
}

/* ---------- collection bar (placeholder for step 5) ---------- */
.collection {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 5;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 10px;
    padding: 6px 10px;
    font-family: monospace;
    font-size: 0.78rem;
    color: rgba(255, 255, 255, 0.85);
    pointer-events: auto;
}
.collection strong { color: var(--accent-cyan); }

/* ---------- footer ---------- */
footer {
    position: absolute;
    bottom: 4px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.62rem;
    opacity: 0.5;
    pointer-events: none;
    z-index: 6;
}
footer a { color: #fff; pointer-events: auto; }
</style>

</head>
<body>

<header class="top">
    <a href="../" class="back">&larr; Madderverse</a>
    <h1>Go Eat Worms</h1>
    <span class="header-spacer" aria-hidden="true"></span>
</header>

<div class="stage" id="stage" aria-label="Fishing area">
    <div class="waterline" aria-hidden="true"></div>
    <div class="shore" aria-hidden="true"></div>

    <div class="collection" id="collection">
        Caught <strong id="caughtCount">0</strong>
    </div>

    <!-- Fishing line: from a virtual rod anchor (top of stage) to the bait.
         Updated each frame as the bait moves. -->
    <svg class="line-layer" id="lineLayer" aria-hidden="true">
        <line id="fishLine" class="fish-line" x1="0" y1="0" x2="0" y2="0"/>
    </svg>

    <!-- Aim arc preview (dotted parabola). Hidden until the kid touches
         the bait; shown while aiming. -->
    <svg class="arc-layer" id="arcLayer" aria-hidden="true">
        <path id="arcPath"   class="arc-path"   d=""/>
        <circle id="arcTarget" class="arc-target" cx="-100" cy="-100" r="7"/>
    </svg>

    <!-- Worm at the shore. Touch-and-hold to aim, flick up to cast. -->
    <div class="bait" id="bait" aria-label="Worm bait">
        <svg viewBox="0 0 80 44" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <!-- segmented body: a wavy thick stroke -->
            <path
                d="M 8 28 Q 18 14 28 28 T 48 28 T 68 28"
                fill="none"
                stroke="var(--worm-deep)"
                stroke-width="13"
                stroke-linecap="round"/>
            <path
                d="M 8 28 Q 18 14 28 28 T 48 28 T 68 28"
                fill="none"
                stroke="var(--worm-pink)"
                stroke-width="9"
                stroke-linecap="round"/>
            <!-- segment ribs -->
            <g stroke="var(--worm-deep)" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
                <line x1="18" y1="22" x2="18" y2="32"/>
                <line x1="28" y1="20" x2="28" y2="36"/>
                <line x1="38" y1="22" x2="38" y2="34"/>
                <line x1="48" y1="20" x2="48" y2="36"/>
                <line x1="58" y1="22" x2="58" y2="34"/>
            </g>
            <!-- eye on the rightmost end (head) -->
            <circle cx="70" cy="26" r="2.6" fill="#fff"/>
            <circle cx="70.6" cy="26" r="1.4" fill="#1a1a1a"/>
        </svg>
    </div>

    <footer>
        &copy; <span id="year"></span>
        <a href="https://madsundar.com/" target="_blank" rel="noopener">Mad Sundar</a>
    </footer>
</div>

<script>
(() => {
    'use strict';

    // ---------- DOM ----------
    const stage      = document.getElementById('stage');
    const bait       = document.getElementById('bait');
    const caughtEl   = document.getElementById('caughtCount');
    const yearEl     = document.getElementById('year');
    const arcLayer   = document.getElementById('arcLayer');
    const arcPath    = document.getElementById('arcPath');
    const arcTarget  = document.getElementById('arcTarget');
    const fishLine   = document.getElementById('fishLine');

    yearEl.textContent = new Date().getFullYear();

    // ---------- collection state ----------
    // Persisted catch list lives in localStorage (step 5 wires this for real).
    const STORAGE_KEY = 'go-eat-worms-collection';
    let collection = [];
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) collection = JSON.parse(raw) || [];
    } catch (e) { /* ignore */ }
    caughtEl.textContent = collection.length;

    // ---------- cast state machine ----------
    // idle    — worm at rest on shore, waiting for touch
    // aiming  — touch held; arc preview tracking finger
    // flying  — bait launched, animating along parabola
    // landed  — bait splashed, sitting in water (step 3 hooks fish in here)
    let mode = 'idle';
    let activePointerId = null;

    // Resting position of the bait in stage coords. Computed lazily because
    // CSS positions it via bottom/left percentages until JS takes over.
    let baitRest = { x: 0, y: 0 };

    // Anchor point for the fishing line — top of the stage at the bait's
    // resting x. The line trails from here to wherever the bait is.
    let lineAnchor = { x: 0, y: 0 };

    // ---------- layout helpers ----------
    function stageRect() { return stage.getBoundingClientRect(); }

    function syncBaitRest() {
        // Read the bait's current center in stage-local coords, while it's
        // still in its CSS-positioned rest state.
        const sr = stageRect();
        const br = bait.getBoundingClientRect();
        baitRest.x = (br.left + br.right) / 2 - sr.left;
        baitRest.y = (br.top  + br.bottom) / 2 - sr.top;
        lineAnchor.x = baitRest.x;
        lineAnchor.y = 0;
        fishLine.setAttribute('x1', lineAnchor.x);
        fishLine.setAttribute('y1', lineAnchor.y);
        updateLine(baitRest.x, baitRest.y);
    }

    function updateLine(x, y) {
        fishLine.setAttribute('x2', x);
        fishLine.setAttribute('y2', y);
    }

    function setBaitPx(x, y) {
        bait.classList.add('in-flight');
        bait.style.left = x + 'px';
        bait.style.top  = y + 'px';
        updateLine(x, y);
    }

    function returnBaitToRest() {
        bait.classList.remove('in-flight');
        bait.style.left = '';
        bait.style.top  = '';
        // syncBaitRest reads the post-CSS position so subsequent flights
        // start from wherever CSS puts the bait now (handles orientation).
        syncBaitRest();
    }

    // ---------- arc math ----------
    // Quadratic Bezier from the rest position through an apex above the
    // midpoint to the target. Apex height scales with throw distance so
    // short flicks have a tighter arc than long ones.
    function computeApex(startX, startY, endX, endY) {
        const dist = Math.hypot(endX - startX, endY - startY);
        const lift = Math.max(80, dist * 0.55);
        return {
            mx: (startX + endX) / 2,
            my: Math.min(startY, endY) - lift
        };
    }

    function bezier(t, p0x, p0y, p1x, p1y, p2x, p2y) {
        const u = 1 - t;
        return {
            x: u * u * p0x + 2 * u * t * p1x + t * t * p2x,
            y: u * u * p0y + 2 * u * t * p1y + t * t * p2y
        };
    }

    // ---------- waterline test ----------
    // The shore takes up the bottom 22% of the stage. Anywhere above that
    // is "valid water" — releasing here casts. Below is "shore" — release
    // here cancels the throw.
    function isInWater(y) {
        const sr = stageRect();
        const waterlineY = sr.height * 0.78;
        return y < waterlineY - 6; // small slop to disallow edge cases
    }

    // ---------- aim ----------
    function showArc(targetX, targetY, valid) {
        const { mx, my } = computeApex(baitRest.x, baitRest.y, targetX, targetY);
        arcPath.setAttribute('d',
            `M ${baitRest.x} ${baitRest.y} Q ${mx} ${my} ${targetX} ${targetY}`);
        arcTarget.setAttribute('cx', targetX);
        arcTarget.setAttribute('cy', targetY);
        arcLayer.classList.toggle('invalid', !valid);
        arcLayer.classList.add('active');
    }

    function hideArc() {
        arcLayer.classList.remove('active', 'invalid');
    }

    // ---------- pointer handlers ----------
    bait.addEventListener('pointerdown', e => {
        if (mode !== 'idle') return;
        e.preventDefault();
        try { bait.setPointerCapture(e.pointerId); } catch (_) {}
        activePointerId = e.pointerId;
        mode = 'aiming';
        document.body.classList.add('aiming');
        syncBaitRest();
        const sr = stageRect();
        const fx = e.clientX - sr.left;
        const fy = e.clientY - sr.top;
        showArc(fx, fy, isInWater(fy));
    });

    function onMove(e) {
        if (mode !== 'aiming' || e.pointerId !== activePointerId) return;
        const sr = stageRect();
        const fx = e.clientX - sr.left;
        const fy = e.clientY - sr.top;
        showArc(fx, fy, isInWater(fy));
    }

    function onUp(e) {
        if (mode !== 'aiming' || e.pointerId !== activePointerId) return;
        try { bait.releasePointerCapture(e.pointerId); } catch (_) {}
        activePointerId = null;
        document.body.classList.remove('aiming');

        const sr = stageRect();
        const fx = e.clientX - sr.left;
        const fy = e.clientY - sr.top;

        if (!isInWater(fy)) {
            // Cancelled — release was on the shore. Reset to idle.
            mode = 'idle';
            hideArc();
            return;
        }

        hideArc();
        launchBait(fx, fy);
    }

    stage.addEventListener('pointermove',   onMove);
    stage.addEventListener('pointerup',     onUp);
    stage.addEventListener('pointercancel', onUp);

    // ---------- launch ----------
    // Animate the bait along the previewed Bezier. Keeps the fishing line
    // attached so the cast looks continuous.
    function launchBait(targetX, targetY) {
        mode = 'flying';
        document.body.classList.add('flying');
        const { mx, my } = computeApex(baitRest.x, baitRest.y, targetX, targetY);

        // Flight time scales with distance — feels more natural than a
        // fixed duration.
        const dist = Math.hypot(targetX - baitRest.x, targetY - baitRest.y);
        const duration = Math.min(950, Math.max(450, dist * 1.6));
        const start = performance.now();

        function frame(now) {
            const t = Math.min((now - start) / duration, 1);
            const p = bezier(t,
                baitRest.x, baitRest.y,
                mx, my,
                targetX, targetY);
            setBaitPx(p.x, p.y);
            if (t < 1) {
                requestAnimationFrame(frame);
            } else {
                splashAt(targetX, targetY);
                landed(targetX, targetY);
            }
        }
        requestAnimationFrame(frame);
    }

    function splashAt(x, y) {
        const ring = document.createElement('div');
        ring.className = 'splash';
        ring.style.left = x + 'px';
        ring.style.top  = y + 'px';
        stage.appendChild(ring);
        setTimeout(() => ring.remove(), 700);
        // Add a second smaller ring for layered effect.
        setTimeout(() => {
            const ring2 = document.createElement('div');
            ring2.className = 'splash';
            ring2.style.left = (x + (Math.random() - 0.5) * 18) + 'px';
            ring2.style.top  = (y + (Math.random() - 0.5) * 12) + 'px';
            ring2.style.opacity = 0.6;
            stage.appendChild(ring2);
            setTimeout(() => ring2.remove(), 700);
        }, 90);
    }

    function landed(x, y) {
        mode = 'landed';
        // Step 3 hooks fish-attraction logic here. For step 2, sit in
        // place a moment, then retrieve the bait.
        setTimeout(() => {
            mode = 'idle';
            document.body.classList.remove('flying');
            returnBaitToRest();
        }, 1400);
    }

    // ---------- orientation / resize ----------
    // Re-anchor the fishing line + bait reference if the viewport reshapes.
    // If a cast is in flight we let it complete and re-sync on landing.
    function onResize() {
        if (mode === 'idle' || mode === 'aiming') {
            syncBaitRest();
        }
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);

    // ---------- init ----------
    // Wait one frame so the .stage has its computed size before we read
    // the bait's CSS-positioned rest coords.
    requestAnimationFrame(() => {
        syncBaitRest();
    });
})();
</script>

</body>
</html>
