<body>
    <a class="madder-home" href="../" aria-label="Back to Madderverse" title="Back to Madderverse">&#x2302;</a>
    <div class="madder-controls">
        <button id="boardsBtn" type="button" class="ctl-btn" aria-label="Choose a board" title="Boards">&#9636;</button>
        <button id="muteBtn" type="button" class="ctl-btn" aria-label="Mute or unmute" title="Sound">&#128266;</button>
    </div>

    <main id="bench">
        <canvas id="scene" aria-label="Soldering bench" role="img"></canvas>

        <header id="hud">
            <div class="hud-name" id="boardName">First Light</div>
            <div class="hud-bar"><span id="progFill"></span></div>
            <div class="hud-sub" id="boardSub">0 of 4 joints</div>
        </header>

        <div id="tray" role="group" aria-label="Tools">
            <button class="tool is-on" type="button" data-tool="iron" aria-pressed="true">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 3.5 15.5 8" />
                    <path d="M16.8 4.8 19.2 7.2" />
                    <path d="M15.5 8 9.5 14" />
                    <path d="M9.5 14 5 20 4 19l5.5-6.5" />
                </svg>
                <span>Iron</span>
            </button>
            <button class="tool" type="button" data-tool="wick" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="16" cy="8" r="4.5" />
                    <path d="M12.5 10.5 4 19" />
                    <path d="M6 15.5 8.5 18" />
                    <path d="M4.2 17.3 6.7 19.8" />
                </svg>
                <span>Wick</span>
            </button>
        </div>

        <div id="coach" hidden>
            <b>Press and hold a silver pad.</b>
            Let it glow, let the solder flow &mdash; then let go.
        </div>

        <div id="report" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="reportTitle">
            <div class="sheet">
                <div class="stamp" id="reportStamp">Good bench</div>
                <h2 id="reportTitle">Bench report</h2>
                <div class="tally" id="reportTally"></div>
                <p class="tip" id="reportTip"></p>
                <div class="sheet-actions">
                    <button id="nextBtn" type="button" class="primary">Next board</button>
                    <button id="redoBtn" type="button">Do it again</button>
                    <button id="closeReport" type="button">Keep tinkering</button>
                </div>
            </div>
        </div>

        <div id="boards" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="boardsTitle">
            <div class="sheet">
                <h2 id="boardsTitle">Boards</h2>
                <div class="board-list" id="boardList"></div>
                <div class="sheet-actions">
                    <button id="closeBoards" type="button">Back to the bench</button>
                </div>
            </div>
        </div>
    </main>

    <script src="game.js?v=2"></script>

    <footer class="site-footer-slim" aria-label="Site info">
        <span>&copy; <span data-year></span> <a href="https://madsundar.com/" target="_blank" rel="noopener">Mad Sundar LLC</a></span>

        <a href="../">Madderverse</a>
        <span class="sep" aria-hidden="true">&middot;</span>
        <a href="../about.html">About</a>
    </footer>
    <script>document.querySelectorAll('[data-year]').forEach(function(el){el.textContent=new Date().getFullYear();});</script>
</body>
