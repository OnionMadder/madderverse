        "three/addons/": "./vendor/addons/",
        "cannon-es": "./vendor/cannon-es.js"
      }
    }

<body>
    <a class="home" href="../" aria-label="Back to Madderverse" title="Back to Madderverse">&#x2302;</a>

    <canvas id="scene" aria-label="Hole-Up game"></canvas>
