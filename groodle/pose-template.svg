<?xml version="1.0" encoding="UTF-8"?>
<!--
  GROODLE POSE TEMPLATE  —  hand-draw a silhouette frame
  ======================================================

  WHY THIS EXISTS
  The six humanoid poses (Standing / Cheering / Star / Groovy / T-Pose /
  Waving) are generated by groodleBodyPath() in game.js. Any pose can
  instead use a HAND-DRAWN shape: set `path:` on that pose in the POSES
  map (game.js) and the generator is bypassed — exactly how Ghost and
  Animal already work. This file is the canvas to draw that shape in.

  HARD RULES (or the clip / outline ring / pattern / gallery break)
  1. Keep the viewBox EXACTLY "0 0 400 600". Don't resize the artboard.
  2. Deliver ONE single closed, filled shape (a <path>). If you draw
     pieces, union them (boolean Union) into one path before export.
  3. No strokes, no transforms baked in, no groups — just the path's
     `d`. M / L / C / Q / Z commands only (no `A` arcs: some renderers
     flatten them differently — convert arcs to curves on export).
  4. Stay on-model so the existing faces / clothing / coloring-book
     pages still line up: keep the head, shoulders, waist, hips and
     feet near the GUIDE marks below. Stylize freely WITHIN that
     envelope. (Want a totally different body? That's fine too — tell
     me and I'll retune the BODY anchor numbers in game.js to match.)

  HOW TO HAND IT BACK
  Open in Figma / Illustrator / Inkscape (or trace a paper drawing),
  reshape the pale reference body (or draw your own on the DRAW HERE
  layer), Union to one path, export SVG, and send me either the whole
  file or just the <path d="…"> string. I paste it into POSES[<id>].path
  in game.js and bump the service-worker version. One pose at a time is
  fine — they're independent.

  Tip: the pale grey shape below is the live, verified Standing
  silhouette. Reshaping it is the fastest start; delete it if you'd
  rather draw from scratch over the guides.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">

  <!-- ===== artboard ===== -->
  <rect x="0" y="0" width="400" height="600" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="399" height="599" fill="none" stroke="#d0d0d8" stroke-width="1"/>

  <!-- ===== ANCHOR GUIDES (do not export this group) ===== -->
  <g id="guides" fill="none" stroke="#7db4ff" stroke-width="1" opacity="0.9">
    <!-- vertical centre axis: the body is centred on x = 200 -->
    <line x1="200" y1="0" x2="200" y2="600" stroke="#ffb3d9" stroke-dasharray="4 5"/>
    <!-- head: circle centred (200,92) radius 58; top of head y = 34 -->
    <circle cx="200" cy="92" r="58" stroke="#7db4ff" stroke-dasharray="3 4"/>
    <!-- shoulder line  y = 188, half-width 56  (x 144 … 256) -->
    <line x1="120" y1="188" x2="280" y2="188" stroke-dasharray="3 4"/>
    <!-- waist line     y = 290, half-width ~38 (x 162 … 238) -->
    <line x1="140" y1="290" x2="260" y2="290" stroke-dasharray="3 4"/>
    <!-- hip line        y = 392, half-width 44  (x 156 … 244) -->
    <line x1="130" y1="392" x2="270" y2="392" stroke-dasharray="3 4"/>
    <!-- foot baseline   y = 566 (feet rest here) -->
    <line x1="80" y1="566" x2="320" y2="566" stroke="#7db4ff" stroke-dasharray="3 4"/>
  </g>

  <!-- ===== guide labels (do not export) ===== -->
  <g id="labels" font-family="system-ui, sans-serif" font-size="11" fill="#5a6b8c">
    <text x="262" y="40">head top  y=34</text>
    <text x="262" y="96">head  (200,92) r58</text>
    <text x="284" y="192">shoulders  y=188</text>
    <text x="264" y="294">waist  y=290</text>
    <text x="274" y="396">hips  y=392</text>
    <text x="120" y="582" text-anchor="middle">feet baseline  y=566</text>
    <text x="200" y="18" text-anchor="middle" fill="#c44f93">centre  x=200</text>
  </g>

  <!-- ===== REFERENCE: live verified Standing silhouette =====
       Reshape this (it is one closed path) or delete it and draw your
       own on the layer below. This is what the engine produces today. -->
  <path id="reference-standing" fill="#0000000f" stroke="#9aa3b5" stroke-width="0.75"
        d="M 258.00 92.00 C 258.00 124.03 232.03 150.00 200.00 150.00 C 167.97 150.00 142.00 124.03 142.00 92.00 C 142.00 59.97 167.97 34.00 200.00 34.00 C 232.03 34.00 258.00 59.97 258.00 92.00 Z M 226.56 124.73 L 233.44 197.24 C 231.78 214.46 217.30 227.60 200.00 227.60 C 182.70 227.60 168.22 214.46 166.56 197.24 L 173.44 124.73 C 172.47 114.63 177.30 104.85 185.92 99.50 C 194.54 94.14 205.46 94.14 214.08 99.50 C 222.70 104.85 227.53 114.63 226.56 124.73 Z M 253.15 175.93 L 237.41 284.32 C 239.65 299.04 233.04 313.70 220.54 321.78 C 208.04 329.86 191.96 329.86 179.46 321.78 C 166.96 313.70 160.35 299.04 162.59 284.32 L 146.85 175.93 C 150.84 149.65 173.43 130.24 200.00 130.24 C 226.57 130.24 249.16 149.65 253.15 175.93 Z M 237.76 292.51 L 244.78 398.98 C 243.21 422.56 223.63 440.88 200.00 440.88 C 176.37 440.88 156.79 422.56 155.22 398.98 L 162.24 292.51 C 161.31 278.42 168.29 264.99 180.36 257.66 C 192.43 250.33 207.57 250.33 219.64 257.66 C 231.71 264.99 238.69 278.42 237.76 292.51 Z M 246.87 192.50 L 265.17 342.14 C 266.60 348.48 264.41 355.09 259.49 359.33 C 254.57 363.57 247.71 364.76 241.65 362.42 C 235.59 360.07 231.32 354.58 230.53 348.13 L 197.50 201.04 C 195.89 187.77 204.96 175.57 218.13 173.29 C 231.30 171.01 243.94 179.46 246.87 192.50 Z M 202.50 201.04 L 169.47 348.13 C 168.68 354.58 164.41 360.07 158.35 362.42 C 152.29 364.76 145.43 363.57 140.51 359.33 C 135.59 355.09 133.40 348.48 134.83 342.14 L 153.13 192.50 C 156.06 179.46 168.70 171.01 181.87 173.29 C 195.04 175.57 204.11 187.77 202.50 201.04 Z M 243.41 360.81 L 257.92 563.38 C 258.87 571.34 255.44 579.19 248.95 583.88 C 242.46 588.58 233.93 589.40 226.67 586.01 C 219.41 582.62 214.55 575.57 213.98 567.58 L 189.91 365.92 C 188.87 351.36 199.63 338.63 214.17 337.24 C 228.70 335.85 241.68 346.32 243.41 360.81 Z M 210.09 365.92 L 186.02 567.58 C 185.45 575.57 180.59 582.62 173.33 586.01 C 166.07 589.40 157.54 588.58 151.05 583.88 C 144.56 579.19 141.13 571.34 142.08 563.38 L 156.59 360.81 C 158.32 346.32 171.30 335.85 185.83 337.24 C 200.37 338.63 211.13 351.36 210.09 365.92 Z "/>

  <!-- ===== DRAW YOUR SILHOUETTE HERE =====
       Replace the d below with your shape, OR reshape the reference
       above. Must end up as ONE closed filled path. This is the only
       thing that gets shipped. -->
  <path id="draw-here" fill="#00000000" d=""/>

</svg>
