<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="All Munkis adaptive icon foreground">
    <!-- ============================================================
         Android adaptive-icon FOREGROUND   *** PLACEHOLDER ***

         108dp canvas; the SAFE ZONE is the inner ~66dp circle (~61%
         of the full bleed). Designed at 1024×1024 — the Munki + its
         headphones fit inside the centered circle of ~Ø640 so EVERY
         mask shape (circle / squircle / teardrop / pill) shows the
         whole character with no clipping.

         Background of the adaptive icon = solid #0c0c1a, set in
         capacitor.config.json + the generated Android resource.
         This file is foreground ONLY — no opaque background, so the
         system fill shows through.

         Swap spec: ../store-assets/README.md
         ============================================================ -->
    <defs>
        <radialGradient id="fgShine" cx="42%" cy="38%" r="70%">
            <stop offset="0"   stop-color="#ffffff" stop-opacity="0.32"/>
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
            <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Everything below sits inside the ~200..824 safe box. -->
    <g transform="translate(512 530) scale(0.86)">
        <!-- mini rainbow under the Munki, kept tight to stay in-zone -->
        <g fill="none" stroke-linecap="round" opacity="0.95">
            <path d="M-238 250 A 238 238 0 0 1 238 250" stroke="#dc2626" stroke-width="26"/>
            <path d="M-204 250 A 204 204 0 0 1 204 250" stroke="#ff9800" stroke-width="26"/>
            <path d="M-170 250 A 170 170 0 0 1 170 250" stroke="#fbbf24" stroke-width="26"/>
            <path d="M-136 250 A 136 136 0 0 1 136 250" stroke="#43a047" stroke-width="26"/>
            <path d="M-102 250 A 102 102 0 0 1 102 250" stroke="#1e88e5" stroke-width="26"/>
            <path d="M-68  250 A 68  68  0 0 1 68  250" stroke="#9c27b0" stroke-width="26"/>
        </g>
        <!-- body -->
        <ellipse cx="0" cy="120" rx="170" ry="178" fill="#1e88e5" stroke="#0d3a66" stroke-width="12"/>
        <ellipse cx="0" cy="90" rx="142" ry="142" fill="url(#fgShine)"/>
        <ellipse cx="-54" cy="290" rx="44" ry="22" fill="#0d3a66"/>
        <ellipse cx="54"  cy="290" rx="44" ry="22" fill="#0d3a66"/>
        <!-- head -->
        <circle cx="0" cy="-110" r="150" fill="#1e88e5" stroke="#0d3a66" stroke-width="12"/>
        <circle cx="0" cy="-110" r="150" fill="url(#fgShine)"/>
        <circle cx="-52" cy="-128" r="20" fill="#0c1622"/>
        <circle cx="52"  cy="-128" r="20" fill="#0c1622"/>
        <circle cx="-45" cy="-135" r="6" fill="#fff"/>
        <circle cx="59"  cy="-135" r="6" fill="#fff"/>
        <path d="M-58 -56 Q0 -12 58 -56" fill="none" stroke="#0c1622" stroke-width="16" stroke-linecap="round"/>
        <circle cx="-92" cy="-80" r="20" fill="#ff5cab" opacity="0.6"/>
        <circle cx="92"  cy="-80" r="20" fill="#ff5cab" opacity="0.6"/>
        <!-- headphones -->
        <path d="M-150 -110 A 150 150 0 0 1 150 -110" fill="none" stroke="#111" stroke-width="30" stroke-linecap="round"/>
        <path d="M-150 -110 A 150 150 0 0 1 150 -110" fill="none" stroke="#444" stroke-width="10" stroke-linecap="round"/>
        <ellipse cx="-150" cy="-110" rx="42" ry="56" fill="#161616" stroke="#000" stroke-width="8"/>
        <ellipse cx="-150" cy="-110" rx="24" ry="36" fill="#3a3a3a"/>
        <ellipse cx="150"  cy="-110" rx="42" ry="56" fill="#161616" stroke="#000" stroke-width="8"/>
        <ellipse cx="150"  cy="-110" rx="24" ry="36" fill="#3a3a3a"/>
        <circle cx="-150" cy="-78" r="6" fill="#2dd4bf"/>
    </g>
</svg>
