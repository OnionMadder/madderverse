    <link rel="manifest" href="https://madderverse.org/assets/favi/site.webmanifest" />

    <link rel="stylesheet" href="style.css" />
    <meta name="apple-mobile-web-app-title" content="Go Eat Worms" />
    <meta name="application-name" content="Go Eat Worms" />
    <script data-goatcounter="https://madderverse.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header class="top">
    <a href="../" class="back">&larr; Madderverse</a>
    <h1>Go Eat Worms</h1>
    <span class="header-spacer" aria-hidden="true"></span>
</header>

<div class="stage" id="stage" aria-label="Fishing area">
    <div class="waterline" aria-hidden="true"></div>
    <div class="shore" aria-hidden="true"></div>

    <div class="collection" id="collection">
        Caught <strong id="caughtCount">0</strong>
    </div>

    <!-- Fishing line: from a virtual rod anchor (top of stage) to the bait.
         Updated each frame as the bait moves. -->
    <svg class="line-layer" id="lineLayer" aria-hidden="true">
        <line id="fishLine" class="fish-line" x1="0" y1="0" x2="0" y2="0"/>
    </svg>

    <!-- Stretchy slingshot rubber band. Pink elastic line from the worm's
         shore anchor to the finger while the kid yanks the worm back.
         Visible only during 'pulling' state. -->
    <svg class="band-layer" id="bandLayer" aria-hidden="true">
        <path id="bandShadow" class="rubber-band-shadow" d=""/>
        <path id="bandPath"   class="rubber-band"        d=""/>
    </svg>

    <!-- Worm at the shore. Grab and YANK to slingshot it. -->
    <div class="bait" id="bait" aria-label="Worm bait">
        <svg viewBox="0 0 80 44" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
            <!-- segmented body: a wavy thick stroke -->
            <path
                d="M 8 28 Q 18 14 28 28 T 48 28 T 68 28"
                fill="none"
                stroke="var(--worm-deep)"
                stroke-width="13"
                stroke-linecap="round"/>
            <path
                d="M 8 28 Q 18 14 28 28 T 48 28 T 68 28"
                fill="none"
                stroke="var(--worm-pink)"
                stroke-width="9"
                stroke-linecap="round"/>
            <!-- segment ribs -->
            <g stroke="var(--worm-deep)" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
                <line x1="18" y1="22" x2="18" y2="32"/>
                <line x1="28" y1="20" x2="28" y2="36"/>
                <line x1="38" y1="22" x2="38" y2="34"/>
                <line x1="48" y1="20" x2="48" y2="36"/>
                <line x1="58" y1="22" x2="58" y2="34"/>
            </g>
            <!-- eye on the rightmost end (head) -->
            <circle cx="70" cy="26" r="2.6" fill="#fff"/>
            <circle cx="70.6" cy="26" r="1.4" fill="#1a1a1a"/>
        </svg>
    </div>

    <footer>
        &copy; <span id="year"></span>
        <a href="https://madsundar.com/" target="_blank" rel="noopener">Mad Sundar</a>
    </footer>
</div>

<script src="game.js"></script>

</body>
</html>
