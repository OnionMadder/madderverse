</head>
<body>

<header class="top">
    <a href="../" class="back">&larr; FYMZ</a>
    <h1>Bala Draws</h1>
    <button class="rotate-btn" id="rotate" aria-label="Rotate canvas"><span class="ico">⟲</span></button>
</header>

<div class="stage">
    <div class="paper-frame frame-none" id="paper-frame">
        <div class="paper landscape" id="paper">
            <svg id="template-svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet"></svg>
            <canvas id="canvas"></canvas>
        </div>
    </div>
</div>

<div class="toolbar">
    <div class="panel-area">
        <div class="panel panel-tools active" data-panel="tools">
            <div class="palette" id="palette"></div>
            <div class="row">
                <div class="sizes" id="brush-sizes">
                    <button class="size-btn" data-size="4" aria-label="Small brush"><span class="dot"></span></button>
                    <button class="size-btn active" data-size="14" aria-label="Medium brush"><span class="dot"></span></button>
                    <button class="size-btn" data-size="30" aria-label="Big brush"><span class="dot"></span></button>
                </div>
                <button class="tool-btn" id="eraser" aria-label="Eraser"><span class="ico">🧽</span><span class="lbl">Erase</span></button>
                <button class="tool-btn" id="clear" aria-label="Clear"><span class="ico">🗑️</span><span class="lbl">Clear</span></button>
            </div>
        </div>
        <div class="panel panel-pages" data-panel="pages">
            <div class="thumbs" id="page-thumbs"></div>
        </div>
        <div class="panel panel-frames" data-panel="frames">
            <div class="thumbs" id="frame-thumbs"></div>
        </div>
    </div>
    <div class="tabs-row">
        <button class="tab-btn active" data-tab="tools" aria-label="Drawing tools"><span class="ico">🎨</span><span class="lbl">Tools</span></button>
        <button class="tab-btn" data-tab="pages" aria-label="Pages"><span class="ico">📄</span><span class="lbl">Pages</span></button>
        <button class="tab-btn" data-tab="frames" aria-label="Frames"><span class="ico">🖼️</span><span class="lbl">Frames</span></button>
        <button class="tool-btn newpage" id="new-page" aria-label="New page"><span class="ico">✨</span><span class="lbl">New</span></button>
        <button class="tool-btn primary" id="save" aria-label="Save"><span class="ico">💾</span><span class="lbl">Save</span></button>
    </div>
</div>

<script src="game.js"></script>

</body>
</html>
