<body>

<header class="top">
    <a href="../" class="back" aria-label="Back to The Madderverse">&larr; MADDERVERSE</a>
    <h1>Gr<span class="neon-pink">oo</span>dle</h1>
</header>

<main>
    <div class="stage-row">
        <div class="hint-tag" aria-hidden="true">
            <span>STAY IN THE LINES TO GROOVE!</span>
        </div>

        <div class="stage-wrap">
            <div class="stage" id="stage" aria-label="Drawing stage">
                <div class="bg-layer bg-studio" id="bgLayer"></div>

                <div class="creature" id="creature">
                    <svg class="silhouette" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                        <defs>
                            <filter id="outlineFilter" x="-10%" y="-10%" width="120%" height="120%">
                                <feMorphology operator="dilate" radius="5" in="SourceAlpha" result="dilated"/>
                                <feComposite operator="out" in="dilated" in2="SourceAlpha" result="outline"/>
                                <feFlood flood-color="#1a0f33" result="ink"/>
                                <feComposite operator="in" in="ink" in2="outline"/>
                            </filter>
                            <clipPath id="bodyClip">
                                <circle cx="200" cy="100" r="58"/>
                                <rect x="155" y="148" width="90" height="232" rx="42"/>
                                <rect x="-18" y="-160" width="36" height="172" rx="18" transform="translate(165 180) rotate(-52)"/>
                                <rect x="-18" y="-160" width="36" height="172" rx="18" transform="translate(235 180) rotate(52)"/>
                                <rect x="-17" y="0" width="34" height="208" rx="17" transform="translate(180 370) rotate(-8)"/>
                                <rect x="-17" y="0" width="34" height="208" rx="17" transform="translate(220 370) rotate(8)"/>
                            </clipPath>
                        </defs>

                        <g class="silhouette-fill">
                            <circle cx="200" cy="100" r="58"/>
                            <rect x="155" y="148" width="90" height="232" rx="42"/>
                            <rect x="-18" y="-160" width="36" height="172" rx="18" transform="translate(165 180) rotate(-52)"/>
                            <rect x="-18" y="-160" width="36" height="172" rx="18" transform="translate(235 180) rotate(52)"/>
                            <rect x="-17" y="0" width="34" height="208" rx="17" transform="translate(180 370) rotate(-8)"/>
                            <rect x="-17" y="0" width="34" height="208" rx="17" transform="translate(220 370) rotate(8)"/>
                        </g>

                        <g class="silhouette-outline" filter="url(#outlineFilter)">
                            <circle cx="200" cy="100" r="58"/>
                            <rect x="155" y="148" width="90" height="232" rx="42"/>
                            <rect x="-18" y="-160" width="36" height="172" rx="18" transform="translate(165 180) rotate(-52)"/>
                            <rect x="-18" y="-160" width="36" height="172" rx="18" transform="translate(235 180) rotate(52)"/>
                            <rect x="-17" y="0" width="34" height="208" rx="17" transform="translate(180 370) rotate(-8)"/>
                            <rect x="-17" y="0" width="34" height="208" rx="17" transform="translate(220 370) rotate(8)"/>
                        </g>
                    </svg>

                    <canvas class="draw-canvas" id="drawCanvas"></canvas>
                </div>

                <div class="stage-floor" id="stageFloor" aria-hidden="true"></div>
            </div>
            <div class="beat-bubble" id="beatBubble" aria-hidden="true"></div>
        </div>

        <div class="bg-picker" id="bgPicker" aria-label="Choose background">
            <button class="bg-thumb active" type="button" data-bg="studio" aria-label="Studio background">
                <span class="bg-preview bg-studio"></span>
            </button>
            <button class="bg-thumb" type="button" data-bg="disco" aria-label="Disco background">
                <span class="bg-preview bg-disco"></span>
            </button>
            <button class="bg-thumb" type="button" data-bg="outdoors" aria-label="Outdoors background">
                <span class="bg-preview bg-outdoors"></span>
            </button>
            <button class="bg-thumb" type="button" data-bg="night" aria-label="Night sky background">
                <span class="bg-preview bg-night"></span>
            </button>
        </div>
    </div>

    <div class="panel" id="drawPanel">
        <div class="panel-row palette" id="palette" aria-label="Color palette"></div>
        <div class="panel-row sizes-row">
            <div class="sizes" id="sizes" aria-label="Brush size"></div>
            <button id="eraserBtn" class="btn small" type="button" aria-label="Eraser">🧽 ERASE</button>
        </div>
        <div class="panel-row actions">
            <button id="randomBtn" class="btn" type="button">🎲 SURPRISE</button>
            <button id="clearBtn" class="btn" type="button">🗑 CLEAR</button>
            <button id="playBtn" class="btn primary" type="button">▶ DANCE</button>
        </div>
    </div>

    <div class="panel dance-panel" id="dancePanel" hidden>
        <div class="now-playing">
            <span class="np-row">MOVE: <strong id="moveLabel">BOUNCE</strong></span>
            <span class="np-row">BEAT: <strong id="beatLabel">BOOM</strong></span>
        </div>
        <div class="panel-row actions">
            <button id="moveBtn" class="btn" type="button">↻ MOVE</button>
            <button id="beatBtn" class="btn" type="button">↻ BEAT</button>
            <button id="stopBtn" class="btn primary" type="button">■ DRAW</button>
        </div>
    </div>
</main>
