<body>
    <a class="madder-home" href="../" aria-label="Back to Madderverse" title="Back to Madderverse">&#x2302;</a>
    <div class="madder-controls">
        <button id="muteBtn" type="button" class="ctl-btn" aria-label="Mute / unmute">&#x1F50A;</button>
    </div>

    <div id="app">
        <header id="hud" aria-hidden="false">
            <div class="hud-cell"><b id="hLvl">1</b><small>Level</small></div>
            <div class="hud-cell"><b id="hToday">—</b><small>Today</small></div>
            <div class="hud-cell timer" id="hTimeWrap"><b id="hTime">60</b><small>Time</small></div>
            <div class="hud-cell"><b id="hScore">0</b><small>Score</small></div>
            <div class="hud-cell combo" id="hComboWrap"><b id="hCombo">x1</b><small>Combo</small></div>
        </header>

        <div id="fridge">
            <div id="grime" aria-hidden="true"></div>
            <div id="shelves"></div>
            <div id="bubbles" aria-hidden="true"></div>
        </div>

        <div id="bins">
            <button class="bin" data-bin="compost" type="button">
                <span class="bin-ico">&#x1F331;</span><span class="bin-name">Compost</span>
            </button>
            <button class="bin" data-bin="keep" type="button">
                <span class="bin-ico">&#x2705;</span><span class="bin-name">Keep</span>
            </button>
            <button class="bin" data-bin="trash" type="button">
                <span class="bin-ico">&#x1F5D1;&#xFE0F;</span><span class="bin-name">Trash</span>
            </button>
        </div>

        <div id="hint">Drag each item to a bin &middot; tap to take a closer look</div>

        <div id="overlay">
            <div class="overlay-card" id="overlayCard"></div>
        </div>
    </div>

    <footer class="site-footer-slim" aria-label="Site info">
        <span>&copy; <span data-year></span> <a href="https://madsundar.com/" target="_blank" rel="noopener">Mad Sundar LLC</a></span>
        <span class="sep" aria-hidden="true">&middot;</span>
        <a href="../">Madderverse</a>
        <span class="sep" aria-hidden="true">&middot;</span>
        <a href="../about.html">About</a>
    </footer>

    <script src="game.js"></script>
    <script>document.querySelectorAll('[data-year]').forEach(function (el) { el.textContent = new Date().getFullYear(); });</script>
</body>
</html>
