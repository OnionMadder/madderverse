<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="All Munkis">
    <!-- ============================================================
         All Munkis — master app icon (1024×1024)   *** PLACEHOLDER ***

         This is a presentable-but-not-final placeholder. It reads at
         every size (48px launcher → 512px Play listing) and matches
         the in-game palette (deep #0c0c1a stage, rainbow Munki, big
         studio headphones). Good enough for an internal-test build;
         swap before public production release.

         Swap spec + final-art brief: ../store-assets/README.md
         iOS-style note kept for parity even though v1 is Android-only:
         solid bleed to corners, NO transparency, NO pre-rounded
         corners (stores mask them). Android adaptive safe zone =
         inner ~72% circle; the Munki sits well inside it.
         ============================================================ -->
    <defs>
        <radialGradient id="bg" cx="50%" cy="34%" r="80%">
            <stop offset="0%"  stop-color="#1a1530"/>
            <stop offset="55%" stop-color="#0c0c1a"/>
            <stop offset="100%" stop-color="#070710"/>
        </radialGradient>
        <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"    stop-color="#dc2626"/>
            <stop offset="0.2"  stop-color="#ff9800"/>
            <stop offset="0.4"  stop-color="#fbbf24"/>
            <stop offset="0.6"  stop-color="#43a047"/>
            <stop offset="0.8"  stop-color="#1e88e5"/>
            <stop offset="1"    stop-color="#9c27b0"/>
        </linearGradient>
        <radialGradient id="bodyShine" cx="42%" cy="38%" r="70%">
            <stop offset="0"   stop-color="#ffffff" stop-opacity="0.35"/>
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
            <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- 1. Full-bleed dark stage -->
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- 2. Rainbow arc rising behind the Munki (the game's whole premise) -->
    <g fill="none" stroke-linecap="round">
        <path d="M152 812 A 360 360 0 0 1 872 812" stroke="#dc2626" stroke-width="34"/>
        <path d="M196 812 A 316 316 0 0 1 828 812" stroke="#ff9800" stroke-width="34"/>
        <path d="M240 812 A 272 272 0 0 1 784 812" stroke="#fbbf24" stroke-width="34"/>
        <path d="M284 812 A 228 228 0 0 1 740 812" stroke="#43a047" stroke-width="34"/>
        <path d="M328 812 A 184 184 0 0 1 696 812" stroke="#1e88e5" stroke-width="34"/>
        <path d="M372 812 A 140 140 0 0 1 652 812" stroke="#9c27b0" stroke-width="34"/>
    </g>

    <!-- 3. The Munki — rounded body + head + signature studio headphones -->
    <g transform="translate(512 560)">
        <!-- arms -->
        <ellipse cx="-150" cy="40" rx="44" ry="78" fill="#1e88e5" stroke="#0d3a66" stroke-width="10" transform="rotate(-16 -150 40)"/>
        <ellipse cx="150"  cy="40" rx="44" ry="78" fill="#1e88e5" stroke="#0d3a66" stroke-width="10" transform="rotate(16 150 40)"/>
        <!-- body -->
        <ellipse cx="0" cy="70" rx="178" ry="186" fill="#1e88e5" stroke="#0d3a66" stroke-width="12"/>
        <ellipse cx="0" cy="96" rx="112" ry="110" fill="#5fa8e8" opacity="0.5"/>
        <ellipse cx="0" cy="40" rx="150" ry="150" fill="url(#bodyShine)"/>
        <!-- feet -->
        <ellipse cx="-58" cy="246" rx="46" ry="24" fill="#0d3a66"/>
        <ellipse cx="58"  cy="246" rx="46" ry="24" fill="#0d3a66"/>
        <!-- head -->
        <circle cx="0" cy="-150" r="150" fill="#1e88e5" stroke="#0d3a66" stroke-width="12"/>
        <circle cx="0" cy="-150" r="150" fill="url(#bodyShine)"/>
        <!-- face -->
        <circle cx="-52" cy="-168" r="20" fill="#0c1622"/>
        <circle cx="52"  cy="-168" r="20" fill="#0c1622"/>
        <circle cx="-45" cy="-175" r="6"  fill="#fff"/>
        <circle cx="59"  cy="-175" r="6"  fill="#fff"/>
        <path d="M-58 -96 Q0 -52 58 -96" fill="none" stroke="#0c1622" stroke-width="16" stroke-linecap="round"/>
        <circle cx="-92" cy="-120" r="20" fill="#ff5cab" opacity="0.6"/>
        <circle cx="92"  cy="-120" r="20" fill="#ff5cab" opacity="0.6"/>
        <!-- oversized studio headphones (game signature) -->
        <path d="M-150 -150 A 150 150 0 0 1 150 -150" fill="none" stroke="#111" stroke-width="30" stroke-linecap="round"/>
        <path d="M-150 -150 A 150 150 0 0 1 150 -150" fill="none" stroke="#444" stroke-width="10" stroke-linecap="round"/>
        <ellipse cx="-150" cy="-150" rx="42" ry="56" fill="#161616" stroke="#000" stroke-width="8"/>
        <ellipse cx="-150" cy="-150" rx="24" ry="36" fill="#3a3a3a"/>
        <ellipse cx="150"  cy="-150" rx="42" ry="56" fill="#161616" stroke="#000" stroke-width="8"/>
        <ellipse cx="150"  cy="-150" rx="24" ry="36" fill="#3a3a3a"/>
        <circle cx="-150" cy="-118" r="6" fill="#2dd4bf"/>
    </g>
</svg>
