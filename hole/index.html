<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hole (prototype)</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Three.js, vendored locally so the prototype runs fully offline. -->
    <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
    </script>
</head>

<body>
    <a class="home" href="../" aria-label="Back to The Madderverse" title="Back to The Madderverse">&#x2302;</a>

    <canvas id="scene" aria-label="Hole game"></canvas>

    <div class="hud" aria-live="polite">
        <span class="hud-item">Size <b id="hudSize">1.0</b></span>
        <span class="hud-item">Eaten <b id="hudEaten">0</b></span>
    </div>

    <button id="resetBtn" class="reset-btn" type="button">Reset</button>

    <div id="devPanel" class="dev-panel" hidden aria-label="Dev controls">
        <div class="dev-row">
            <label for="devSens">SENSITIVITY <span id="devSensOut">1.0</span></label>
            <input id="devSens" type="range" min="0.4" max="2.5" step="0.1" value="1">
        </div>
        <div class="dev-row">
            <label for="devFit">FIT_SLACK <span id="devFitOut">0.30</span></label>
            <input id="devFit" type="range" min="0" max="1" step="0.05" value="0.3">
        </div>
        <button id="devCopy" class="dev-btn" type="button">Copy values</button>
        <span id="devCopyMsg" class="dev-msg" aria-live="polite"></span>
    </div>

    <p class="hint" id="hint">Drag to move the hole. Swallow small things to grow.</p>

    <script type="module" src="main.js"></script>
</body>
</html>
