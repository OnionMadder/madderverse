<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy Policy — Groodle</title>

    <!--
      Redirect shim.

      The Groodle policy lives at /groodle/privacy/ (a directory, matching
      Cookie Cache and Slip Studio). Pootery's is /pootery/privacy.html, so
      /groodle/privacy.html is an easy URL to reach for by habit — and it
      used to 404, which is exactly what Play Console's privacy-policy check
      reports as "page not found".

      Both forms now resolve. Do not delete this: a store listing may already
      point at it, and a policy URL that 404s blocks review.
    -->
    <link rel="canonical" href="https://madderverse.org/groodle/privacy/" />
    <meta http-equiv="refresh" content="0; url=/groodle/privacy/" />
    <meta name="robots" content="noindex, follow" />

    <link rel="shortcut icon" href="https://madderverse.org/assets/favi/favicon.ico" />
    <meta name="theme-color" content="#ff6ec7" />

    <style>
        html, body { margin: 0; padding: 0; }
        body {
            background: #1a0f33;
            color: #f3eefb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         Helvetica, Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        a { color: #ff6ec7; }
    </style>
    <script>location.replace('/groodle/privacy/');</script>
</head>
<body>
    <p>
        Groodle's privacy policy has moved to<br>
        <a href="/groodle/privacy/">madderverse.org/groodle/privacy/</a>
    </p>
</body>
</html>
