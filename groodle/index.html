<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="canonical" href="https://madderverse.org/groodle/" />
    <meta property="og:url" content="https://madderverse.org/groodle/" />
    <meta name="twitter:url" content="https://madderverse.org/groodle/" />
    <meta name="title" content="Groodle - The Madderverse" />
    <meta name="description" content="Draw a little doodle, then watch it dance to the beat. Free and ad-free for kids." />
    <meta name="keywords" content="The Madderverse, Onion Madder, Mad Sundar LLC, indie kids games, free kids games, ad-free games, drawing, dance, doodle" />
    <meta name="author" content="Onion Madder" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Groodle - Draw a doodle, watch it dance." />
    <meta property="og:description" content="Free, ad-free drawing-and-dance toy for kids." />
    <meta property="og:image" content="https://madderverse.org/assets/img/logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Groodle - Draw a doodle, watch it dance." />
    <meta name="twitter:description" content="Free, ad-free drawing-and-dance toy for kids." />
    <meta name="twitter:image" content="https://madderverse.org/assets/img/twitter-card.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://madderverse.org/assets/favi/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="https://madderverse.org/assets/favi/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="https://madderverse.org/assets/favi/favicon-16x16.png" />
    <link rel="manifest" href="https://madderverse.org/assets/favi/site.webmanifest" />
    <link rel="shortcut icon" href="https://madderverse.org/assets/favi/favicon.ico" />
    <meta name="theme-color" content="#00ffcc" />
    <meta name="apple-mobile-web-app-title" content="Groodle" />
    <meta name="application-name" content="Groodle" />
    <link rel="stylesheet" href="style.css" />
    <script data-goatcounter="https://madderverse.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<header class="top">
    <a href="../" class="back">&larr; Madderverse</a>
    <h1>Groodle</h1>
    <span class="header-spacer" aria-hidden="true"></span>
</header>

<div class="stage" id="stage">
    <canvas id="canvas" aria-label="Drawing canvas"></canvas>
    <div class="hint" id="hint">Draw a little figure, then tap <strong>Dance!</strong></div>
</div>

<div class="toolbar" id="draw-tools">
    <div class="palette" id="palette" role="toolbar" aria-label="Color palette"></div>
    <div class="row">
        <div class="sizes" id="brush-sizes" role="toolbar" aria-label="Brush size">
            <button class="size-btn" data-size="4" aria-label="Small brush"><span class="dot dot-s"></span></button>
            <button class="size-btn active" data-size="14" aria-label="Medium brush"><span class="dot dot-m"></span></button>
            <button class="size-btn" data-size="32" aria-label="Big brush"><span class="dot dot-l"></span></button>
        </div>
        <button class="tool-btn" id="clear" aria-label="Clear drawing"><span class="ico">🗑️</span><span class="lbl">Clear</span></button>
        <button class="tool-btn primary" id="dance" aria-label="Make it dance"><span class="ico">🎵</span><span class="lbl">Dance!</span></button>
    </div>
</div>

<div class="toolbar hidden" id="dance-tools">
    <div class="row">
        <button class="tool-btn" id="back-to-draw" aria-label="Back to drawing"><span class="ico">✏️</span><span class="lbl">Edit</span></button>
        <label class="bpm-label">
            <span class="bpm-text">BPM <strong id="bpm-val">120</strong></span>
            <input type="range" id="bpm" min="60" max="180" value="120" step="2" aria-label="Beats per minute" />
        </label>
        <button class="tool-btn primary" id="stop-dance" aria-label="Stop"><span class="ico">⏹</span><span class="lbl">Stop</span></button>
    </div>
</div>

<footer>
    <p>&copy; <span id="year"></span> <a href="https://madsundar.com/" target="_blank" rel="noopener">Mad Sundar</a></p>
</footer>

<script src="game.js"></script>
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
