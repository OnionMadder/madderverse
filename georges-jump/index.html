<body>

<div class="thumb-zone left" aria-hidden="true"></div>
<div class="thumb-zone right" aria-hidden="true"></div>

<a class="madder-home" href="../" aria-label="Back to The Madderverse" title="Back to The Madderverse">&#x2302;</a>

<!-- Page-nav header stripped. Score/level/timer badges + control
     buttons floated into the universal top-right cluster.
     "Bagawk! / George's Jump" title and task-desc copy from
     the old header are gone — page-title is implied by URL +
     home button. -->
<div class="madder-controls">
<span class="badge mascot-badge" id="mascotBadge" hidden><canvas id="mascotHudCanvas" width="28" height="28" aria-label="Equipped mascot"></canvas></span>
<span class="badge level-badge">Lv <strong id="level">1</strong> · <span id="difficulty" class="diff diff-easy">EASY</span></span>
<span class="badge">Score: <strong id="score">0</strong></span>
<span class="badge coin-badge" id="coinBadge" title="Coins (spend on mascots)">&#127942; <strong id="coins">0</strong></span>
<span class="badge eaten-badge" id="eatenBadge">Eaten: <strong id="fullness">0/0</strong></span>
<span class="badge combo-badge" id="comboBadge" hidden>Combo: <strong id="combo">x1</strong></span>
<span class="badge timer-badge">Time: <strong id="timer">120</strong>s</span>
<span class="badge">Best: <strong id="best">0</strong></span>
<button id="scoresBtn" class="btn btn-icon" type="button" title="High scores">&#9733;</button>
<button id="mascotBtn" class="btn btn-icon" type="button" title="Mascot shop (C)">&#127917;</button>
<button id="skinBtn" class="btn btn-icon" type="button" title="Choose George">&#128020;</button>
<button id="mute" class="btn btn-icon" type="button" title="Mute music (M)" aria-pressed="false">&#9834;</button>
<button id="restart" class="btn" type="button" title="Restart (R)">Restart</button>
</div>
<!-- task-desc moved here, hanging just below the home button -->
<div class="meta" id="taskDesc" style="position:fixed;top:max(58px,calc(env(safe-area-inset-top,0px) + 58px));left:max(12px,env(safe-area-inset-left,0px));z-index:55;font-size:11px;letter-spacing:1px;color:rgba(255,255,255,0.55);pointer-events:none;">Eat as much as you can!</div>
<div class="wrap">

<div class="stage">
    <canvas id="game" width="320" height="180" aria-label="Bagawk game canvas"></canvas>
    <div id="endScreen" class="end-screen" hidden>
        <div class="end-card">
            <h2 id="endTitle">Time's up!</h2>
            <p id="endMsg"></p>
            <div class="end-stats">
                <span>Score <strong id="endScore">0</strong></span>
                <span>Eaten <strong id="endEaten">0</strong></span>
                <span>Best Combo <strong id="endCombo">x1</strong></span>
            </div>
            <div id="endNew" class="end-new" hidden>NEW LEVEL BEST!</div>
            <div id="endUnlock" class="end-unlock" hidden></div>
            <button id="playAgain" class="btn" type="button">Play Again</button>
        </div>
    </div>

    <div id="skinModal" class="modal" hidden>
        <div class="modal-card">
            <h2>Choose George</h2>
            <div id="skinGrid" class="skin-grid"></div>
            <button class="btn modal-close" data-close="skinModal" type="button">Close</button>
        </div>
    </div>

    <div id="scoresModal" class="modal" hidden>
        <div class="modal-card">
            <h2>High Scores</h2>
            <div id="scoresOverall" class="scores-overall"></div>
            <div id="scoresList" class="scores-list"></div>
            <button class="btn modal-close" data-close="scoresModal" type="button">Close</button>
        </div>
    </div>

    <div id="mascotModal" class="modal" hidden>
        <div class="modal-card">
            <h2>Mascot Shop</h2>
            <div class="mascot-balance">Coins: <strong id="mascotCoins">0</strong></div>
            <div id="mascotGrid" class="mascot-grid"></div>
            <button class="btn modal-close" data-close="mascotModal" type="button">Close</button>
        </div>
    </div>
</div>
</div>

<script type="module" src="game.js"></script>

<footer class="site-footer-slim" aria-label="Site info">
    <span>&copy; <span data-year></span> <a href="https://madsundar.com/" target="_blank" rel="noopener">Mad Sundar LLC</a></span>
    <span class="sep" aria-hidden="true">·</span>
    <a href="../">The Madderverse</a>
    <span class="sep" aria-hidden="true">·</span>
    <a href="../about.html">About</a>
</footer>
<script>document.querySelectorAll('[data-year]').forEach(function(el){el.textContent=new Date().getFullYear();});</script>

</body>
</html>
