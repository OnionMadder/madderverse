<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Let's CRAYte! Pootery">
  <!-- Maskable: background must cover the full canvas; icon
       content must sit inside the central 80% safe area
       (between x=51 and x=461, y=51 and y=461). Android masks
       crop the outer 10% so any content there can be lost. -->
  <rect width="512" height="512" fill="#ff2e88"/>

  <defs>
    <linearGradient id="clayM" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#2c1306"/>
      <stop offset="0.20" stop-color="#5a2b14"/>
      <stop offset="0.45" stop-color="#a25a2c"/>
      <stop offset="0.55" stop-color="#b06a36"/>
      <stop offset="0.80" stop-color="#7a3d1a"/>
      <stop offset="1"    stop-color="#2c1306"/>
    </linearGradient>
  </defs>

  <!-- Pot pulled tight into the safe area (center 80%) -->
  <ellipse cx="256" cy="380" rx="120" ry="18" fill="#1a3942"/>
  <path d="M194 380 Q170 308 184 234 Q190 210 212 210 L300 210 Q322 210 328 234 Q342 308 318 380 Q310 388 256 388 Q202 388 194 380 Z"
        fill="url(#clayM)" stroke="#1a0e08" stroke-width="3"/>
  <ellipse cx="256" cy="214" rx="48" ry="8" fill="#1a0904"/>
  <rect x="236" y="228" width="12" height="140" fill="#ffe0b8" opacity="0.28" rx="3"/>
</svg>
