<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Slip Studio</title>

    <link rel="canonical" href="https://madderverse.org/slip-studio/" />
    <meta property="og:url" content="https://madderverse.org/slip-studio/" />
    <meta name="twitter:url" content="https://madderverse.org/slip-studio/" />
    <meta name="title" content="Slip Studio — a calm space to shape clay" />
    <meta name="description" content="A meditative 3D pottery studio. Shape, glaze, and keep your pieces." />
    <meta name="author" content="Onion Madder" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Slip Studio" />
    <meta property="og:description" content="A meditative 3D pottery studio. Shape, glaze, and keep your pieces." />
    <meta property="og:image" content="https://madderverse.org/assets/img/logo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Slip Studio" />
    <meta name="twitter:description" content="A meditative 3D pottery studio. Shape, glaze, and keep your pieces." />

    <link rel="apple-touch-icon" sizes="180x180" href="assets/favi/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favi/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favi/favicon-16x16.png" />
    <link rel="manifest" href="assets/favi/site.webmanifest" />
    <link rel="shortcut icon" href="assets/favi/favicon.ico" />
    <meta name="theme-color" content="#1b1815" />
    <meta name="apple-mobile-web-app-title" content="Slip Studio" />
    <meta name="application-name" content="Slip Studio" />

    <link rel="stylesheet" href="style.css?v=81" />

    <!-- Three.js, vendored locally so the app runs fully offline. -->
    <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
    </script>

</head>

<body>
    <!-- Toolbar icon sprites. One <symbol> per icon, referenced via
         <use href="#icon-x"/> in each button so the SVG path data
         lives in one place. Stroke-only line art at 20×20; currentColor
         lets the icon inherit the button's text colour for hover /
         active states. -->
    <svg style="display:none" aria-hidden="true">
        <symbol id="icon-pot" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 4 L12 4 L12 6 C 15.5 7.5, 15.5 14, 12 16 L8 16 C 4.5 14, 4.5 7.5, 8 6 L8 4 Z"/>
        </symbol>
        <symbol id="icon-lid" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 13 C 3 6, 17 6, 17 13"/>
            <line x1="3" y1="13" x2="17" y2="13"/>
            <line x1="9" y1="4" x2="11" y2="4"/>
        </symbol>
        <symbol id="icon-handle" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="3" x2="6" y2="17"/>
            <path d="M6 6 C 14 6, 14 14, 6 14"/>
        </symbol>
        <symbol id="icon-match-rim" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3 L10 9 M7 6.5 L10 9.5 L13 6.5"/>
            <ellipse cx="10" cy="14" rx="7" ry="2"/>
        </symbol>
        <symbol id="icon-swap" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8 C 4 4, 16 4, 16 8"/>
            <path d="M14 6 L16 8 L18 6"/>
            <path d="M16 12 C 16 16, 4 16, 4 12"/>
            <path d="M2 14 L4 12 L6 14"/>
        </symbol>
        <symbol id="icon-photo" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="6" width="15" height="10" rx="1.5"/>
            <path d="M7 6 L8 4 L12 4 L13 6"/>
            <circle cx="10" cy="11" r="2.6"/>
        </symbol>
        <symbol id="icon-save" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3 L10 12"/>
            <path d="M6 9 L10 13 L14 9"/>
            <path d="M4 16 L16 16"/>
        </symbol>
        <symbol id="icon-taller" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 17 L16 17"/>
            <path d="M10 14 L10 4"/>
            <path d="M7 7 L10 4 L13 7"/>
        </symbol>
        <symbol id="icon-shorter" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 3 L16 3"/>
            <path d="M10 6 L10 16"/>
            <path d="M7 13 L10 16 L13 13"/>
        </symbol>
    </svg>

    <div id="backdrop" class="backdrop"></div>
    <video id="backdropVideo" class="backdrop-video" autoplay loop muted playsinline preload="metadata" aria-hidden="true"></video>
    <div id="kilnVignette" class="kiln-vignette" aria-hidden="true">
        <div class="kiln-edge"></div>
        <div class="kiln-inner-glow"></div>
    </div>

    <a class="home" href="../" aria-label="Back to The Madderverse" title="Back to The Madderverse">&#x2302;</a>
    <button class="title-btn" id="titleBtn" type="button" aria-label="Back to title" title="Title screen">&#x21A9;</button>
    <button class="gallery-open" id="galleryBtn" type="button" aria-label="Your pots" title="Your pots">&#x25A6;</button>

    <canvas id="scene" aria-label="Pottery scene"></canvas>

    <div id="loader" class="loader" role="status" aria-live="polite">
        <div class="loader-ring" aria-hidden="true"></div>
        <span class="loader-label">Slip Studio</span>
    </div>

    <div id="landing" class="landing" hidden>
        <h1 class="landing-title">Slip Studio</h1>
        <p class="landing-tag">a calm place to shape clay</p>
        <div class="shape-picker" id="shapePicker" role="group" aria-label="Starter shape"></div>
        <div class="bg-picker" id="bgPicker" role="group" aria-label="Backdrop"></div>
        <div class="sound-toggles">
            <button class="music-toggle" id="musicToggle" type="button" aria-pressed="true">&#9834; Music on</button>
            <button class="music-toggle" id="sfxToggle"   type="button" aria-pressed="true">&#9835; SFX on</button>
        </div>
        <button id="beginBtn" class="landing-btn" type="button">Begin</button>
        <button id="landingGallery" class="landing-link" type="button">Your pots</button>
        <a id="landingAppLink" class="landing-link landing-app-link" href="https://play.google.com/store/apps/details?id=org.madderverse.slipstudio" target="_blank" rel="noopener">Get the Android app &#x2197;</a>
    </div>

    <div class="lid-style-picker" id="lidStylePicker" role="group" aria-label="Lid style" hidden></div>

    <div class="brush-bar" id="brushBar" role="group" aria-label="Brush size">
        <button class="brush-btn" type="button" aria-label="Fine brush" aria-pressed="false"><span class="brush-dot brush-dot-s"></span></button>
        <button class="brush-btn" type="button" aria-label="Medium brush" aria-pressed="false"><span class="brush-dot brush-dot-m"></span></button>
        <button class="brush-btn" type="button" aria-label="Broad brush" aria-pressed="false"><span class="brush-dot brush-dot-l"></span></button>
    </div>

    <div class="deco-stack" id="decoStack" hidden>
        <div class="deco-tabs" role="tablist">
            <button class="deco-tab is-active" id="tabGlaze" type="button" role="tab" aria-selected="true">Glaze</button>
            <button class="deco-tab" id="tabDecorate" type="button" role="tab" aria-selected="false">Decorate</button>
        </div>

        <div class="deco-panel" id="panelGlaze">
            <div class="glaze-pack-tabs" id="glazePackTabs" role="tablist" aria-label="Glaze pack"></div>
            <div class="deco-strip" id="glazeBar" role="group" aria-label="Glaze"></div>
            <div class="deco-strip gradient-wrap" id="gradientWrap" hidden>
                <span class="gradient-label">Bottom</span>
                <span class="gradient-row" id="gradientBar" role="group" aria-label="Bottom gradient glaze"></span>
            </div>
        </div>

        <div class="deco-panel" id="panelDecorate" hidden>
            <div class="deco-row" role="group" aria-label="Decorate tools">
                <button class="deco-tool" id="toolBrush" type="button" aria-pressed="true">Brush</button>
                <button class="deco-tool" id="toolSplatter" type="button" aria-pressed="false">Splatter</button>
                <button class="deco-tool" id="toolStamp" type="button" aria-pressed="false">Stamp</button>
                <button class="deco-tool" id="toolOverlay" type="button" aria-pressed="false">Overlay</button>
                <button class="deco-tool" id="toolCarve" type="button" aria-pressed="false" title="Scratch through the glaze to reveal the clay">Carve</button>
                <button class="deco-tool deco-clear" id="decoClear" type="button">Clear</button>
            </div>
            <div class="deco-strip" id="decoOptions">
                <span class="deco-sizes" id="decoSizes">
                    <button class="deco-size" type="button" aria-label="Small" aria-pressed="false"><span class="brush-dot brush-dot-s"></span></button>
                    <button class="deco-size" type="button" aria-label="Medium" aria-pressed="false"><span class="brush-dot brush-dot-m"></span></button>
                    <button class="deco-size" type="button" aria-label="Large" aria-pressed="false"><span class="brush-dot brush-dot-l"></span></button>
                </span>
                <span class="deco-sub" id="decoSub" role="group" aria-label="Shape or pattern" hidden></span>
            </div>
            <div class="deco-strip" id="decoColors" role="group" aria-label="Paint colour"></div>
        </div>
    </div>

    <div class="toolbar" role="toolbar" aria-label="Pottery stage">
        <div class="toolbar-zone toolbar-left">
            <button id="backBtn" class="tool-btn tool-btn-ghost" type="button" hidden aria-label="Re-wet">&larr;</button>
            <span id="stageLabel" class="stage-chip" aria-live="polite">Wet clay</span>
        </div>
        <div class="toolbar-zone toolbar-center">
            <button id="tallerBtn" class="tool-btn tool-btn-icon" type="button" hidden aria-label="Pull pot taller" title="Pull pot taller">
                <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><use href="#icon-taller"/></svg>
            </button>
            <button id="shorterBtn" class="tool-btn tool-btn-icon" type="button" hidden aria-label="Push pot shorter" title="Push pot shorter">
                <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><use href="#icon-shorter"/></svg>
            </button>
            <button id="swapBtn" class="tool-btn tool-btn-icon" type="button" hidden aria-label="Switch to pot" title="Switch to pot">
                <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><use href="#icon-pot"/></svg>
            </button>
            <button id="handleBtn" class="tool-btn tool-btn-icon" type="button" hidden aria-label="Add handle" title="Add handle">
                <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><use href="#icon-handle"/></svg>
            </button>
            <button id="makeLidBtn" class="tool-btn tool-btn-icon" type="button" hidden aria-label="Add lid" title="Add lid">
                <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><use href="#icon-lid"/></svg>
            </button>
            <button id="matchRimBtn" class="tool-btn tool-btn-icon" type="button" hidden aria-label="Refit lid to pot rim" title="Refit the lid's base to the pot's current rim, keeping your sculpt proportions">
                <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><use href="#icon-match-rim"/></svg>
            </button>
            <button id="photoBtn" class="tool-btn tool-btn-icon" type="button" hidden aria-label="Photo" title="Photo">
                <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><use href="#icon-photo"/></svg>
            </button>
            <button id="saveBtn" class="tool-btn tool-btn-icon" type="button" hidden aria-label="Save" title="Save">
                <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><use href="#icon-save"/></svg>
            </button>
        </div>
        <div class="toolbar-zone toolbar-right">
            <button id="advanceBtn" class="tool-btn tool-btn-primary" type="button">Dry</button>
        </div>
    </div>

    <div id="photoModal" class="photo-modal" role="dialog" aria-label="Photo" hidden>
        <div class="photo-modal-bar">
            <span class="gallery-title">Photo</span>
            <button class="tool-btn" id="photoClose" type="button">Close</button>
        </div>
        <div class="photo-preview-wrap">
            <canvas id="photoPreview" class="photo-preview" aria-label="Photo preview"></canvas>
        </div>
        <div class="photo-row" id="photoStyles" role="group" aria-label="Style">
            <button class="photo-chip" data-style="studio" type="button">Studio</button>
            <button class="photo-chip" data-style="sunlit" type="button">Sunlit</button>
            <button class="photo-chip" data-style="museum" type="button">Museum</button>
        </div>
        <div class="photo-row" id="photoAspects" role="group" aria-label="Aspect">
            <button class="photo-chip" data-aspect="square" type="button">Square</button>
            <button class="photo-chip" data-aspect="portrait" type="button">9 : 16</button>
        </div>
        <button id="photoSave" class="landing-btn" type="button">Save photo</button>
    </div>

    <div id="confirmModal" class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmModalMessage" hidden>
        <div class="confirm-modal-card">
            <p class="confirm-modal-message" id="confirmModalMessage"></p>
            <div class="confirm-modal-actions">
                <button class="confirm-modal-btn" id="confirmModalCancel" type="button">Keep editing</button>
                <button class="confirm-modal-btn confirm-modal-btn-primary" id="confirmModalConfirm" type="button">Discard</button>
            </div>
        </div>
    </div>

    <div class="gallery" id="gallery" role="dialog" aria-label="Your pots" hidden>
        <div class="gallery-bar">
            <span class="gallery-title">Your pots</span>
            <span class="gallery-bar-right">
                <button class="tool-btn" id="galleryViewToggle" type="button">Grid</button>
                <button class="tool-btn" id="galleryClose" type="button">Close</button>
            </span>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
        <p class="gallery-empty" id="galleryEmpty">No pots yet — shape one, fire it, and tap Save.</p>
    </div>

    <footer class="footer" aria-label="Site info">
        <span>&copy; <span data-year>2026</span> <a href="https://madsundar.com/" target="_blank" rel="noopener">Mad Sundar LLC</a></span>
        <span class="sep" aria-hidden="true">&middot;</span>
        <a href="../">The Madderverse</a>
    </footer>

    <script type="module" src="main.js?v=81"></script>
    <script>document.querySelectorAll('[data-year]').forEach(function(el){el.textContent=new Date().getFullYear();});</script>
</body>
</html>
