<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pootery has moved</title>
    <link rel="canonical" href="https://madderverse.org/pootery/" />
    <!-- Redirect shim. Pootery moved from /lets-crayte-pootery/ to /pootery/
         on 2026-05-29. Kept so old shared pot links, push deep-links, and the
         already-published Android app's baked-in URLs keep resolving. The JS
         hop preserves the ?pot= / ?pack= / ?battle= query string + hash; the
         meta-refresh is the no-JS fallback. -->
    <script>
        location.replace("/pootery/" + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=/pootery/" />
</head>
<body>
    <p>Pootery has moved to <a href="/pootery/">madderverse.org/pootery/</a>.</p>
</body>
</html>
