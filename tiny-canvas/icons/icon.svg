<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Tiny Canvas">
    <!-- ============================================================
         Tiny Canvas — master app icon (1024×1024)
         Construction-paper aesthetic on onioncore: torn-edge cream
         paper layered on a deep teal-black tile, with a hot-pink
         crayon scribble + smiley sun + teal accent that read at
         every scale from 16px favicon to 1024px App Store icon.

         iOS spec: solid bleed to corners, NO transparency, NO
         pre-rounded corners — Apple masks them. This icon meets
         that. Android adaptive: safe zone is the inner ~72%
         circle, everything inside that radius is guaranteed to
         render under any mask shape.
         ============================================================ -->

    <defs>
        <!-- Onioncore deep gradient (visible only at the corners,
             since the paper covers most of it) -->
        <radialGradient id="bgGrad" cx="50%" cy="0%" r="100%">
            <stop offset="0%"  stop-color="#0c2a32"/>
            <stop offset="55%" stop-color="#06141a"/>
            <stop offset="100%" stop-color="#04101a"/>
        </radialGradient>

        <!-- Subtle teal scanline overlay (matches DESIGN.md body::before) -->
        <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
            <rect width="6" height="6" fill="transparent"/>
            <line x1="0" y1="0" x2="6" y2="0"
                  stroke="rgba(255,255,255,0.025)" stroke-width="2"/>
        </pattern>

        <!-- Paper grain — slight beige texture via offset dots.
             Visual "tooth" without a real noise filter. -->
        <pattern id="paperGrain" width="12" height="12" patternUnits="userSpaceOnUse">
            <rect width="12" height="12" fill="#fbfaf6"/>
            <circle cx="3" cy="4" r="0.6" fill="#eee6d6" opacity="0.5"/>
            <circle cx="9" cy="9" r="0.5" fill="#eee6d6" opacity="0.45"/>
            <circle cx="7" cy="2" r="0.4" fill="#eee6d6" opacity="0.4"/>
        </pattern>

        <!-- Drop shadow filter for the paper card -->
        <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
            <feOffset dx="0" dy="14" result="blurred"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- 1. Background tile — fills the full bleed -->
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>
    <rect width="1024" height="1024" fill="url(#scanlines)"/>

    <!-- 2. Pink crayon corner scribble (peeks out from under the paper) -->
    <g transform="translate(64 64)">
        <path d="M0 32 Q60 -8 140 16 Q220 40 280 4 Q340 -32 380 8"
              fill="none" stroke="#ff2e88" stroke-width="14"
              stroke-linecap="round" opacity="0.75"/>
    </g>

    <!-- 3. Construction-paper card with a torn / wavy edge.
         Path is deliberately uneven to read as cut-by-hand. The
         shadow filter lifts it off the dark background. -->
    <g filter="url(#paperShadow)">
        <path
            d="M120 158
               C138 152, 175 155, 210 154
               C260 152, 320 158, 380 154
               C440 150, 510 156, 570 154
               C640 152, 710 158, 770 152
               C820 148, 880 156, 900 168
               C912 200, 906 260, 908 320
               C910 380, 902 450, 906 510
               C910 580, 902 660, 906 720
               C908 780, 902 850, 894 880
               C870 894, 800 902, 740 906
               C660 910, 580 902, 510 906
               C440 910, 360 902, 290 906
               C220 910, 160 902, 132 892
               C118 856, 122 800, 118 720
               C114 640, 122 560, 118 480
               C114 400, 122 320, 118 240
               C118 200, 116 174, 120 158 Z"
            fill="url(#paperGrain)"
            stroke="#d9d2c0"
            stroke-width="3"
            stroke-linejoin="round"/>
    </g>

    <!-- 4. The drawing INSIDE the paper card — a chunky smiley sun -->
    <g transform="translate(512 470)">
        <!-- Sun body (line-art style, matches our templates) -->
        <circle cx="0" cy="0" r="160"
                fill="none" stroke="#1c2226" stroke-width="14"
                stroke-linecap="round"/>
        <!-- Sun rays (8 of them) -->
        <g stroke="#1c2226" stroke-width="14" stroke-linecap="round" fill="none">
            <line x1="0"    y1="-200" x2="0"    y2="-240"/>
            <line x1="0"    y1="200"  x2="0"    y2="240"/>
            <line x1="-200" y1="0"    x2="-240" y2="0"/>
            <line x1="200"  y1="0"    x2="240"  y2="0"/>
            <line x1="-141" y1="-141" x2="-170" y2="-170"/>
            <line x1="141"  y1="141"  x2="170"  y2="170"/>
            <line x1="-141" y1="141"  x2="-170" y2="170"/>
            <line x1="141"  y1="-141" x2="170"  y2="-170"/>
        </g>
        <!-- Eyes -->
        <circle cx="-58" cy="-30" r="14" fill="#1c2226"/>
        <circle cx="58"  cy="-30" r="14" fill="#1c2226"/>
        <!-- Smile -->
        <path d="M-72 50 Q0 110 72 50"
              fill="none" stroke="#1c2226" stroke-width="14"
              stroke-linecap="round"/>
        <!-- Rosy cheeks (color from the kid's "brush") -->
        <circle cx="-105" cy="30" r="22" fill="#ff5cab" opacity="0.85"/>
        <circle cx="105"  cy="30" r="22" fill="#ff5cab" opacity="0.85"/>
    </g>

    <!-- 5. Hot-pink crayon scribble across the page — the kid's mark.
         Slightly off-center, with stroke variation that reads as
         hand-drawn. Sits ABOVE the sun so it looks like the kid
         colored on top of a printed page. -->
    <path d="M180 760
             Q280 720 380 750
             T580 760
             Q680 770 780 740"
          fill="none" stroke="#ff2e88" stroke-width="34"
          stroke-linecap="round" opacity="0.92"/>

    <!-- 6. Teal accent scribble — secondary, smaller, off to one side -->
    <path d="M780 220 Q820 260 800 320"
          fill="none" stroke="#00ffcc" stroke-width="14"
          stroke-linecap="round" opacity="0.85"/>

    <!-- 7. Small star sparkle in opposite corner -->
    <g transform="translate(180 220)" fill="#00ffcc">
        <path d="M0 -30 L8 -10 L30 -8 L12 6 L18 28 L0 16 L-18 28 L-12 6 L-30 -8 L-8 -10 Z"/>
    </g>

</svg>
